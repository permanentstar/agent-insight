<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="title desc">
<title id="title">执行模式：决策由谁作出，程序怎样推进</title><desc id="desc">三栏示意反馈循环、显式计划执行与固定编排；执行器可以再包含反馈循环，持久性和协作拓扑是独立维度。</desc>
<rect width="960" height="790" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="#172554">
<text x="30" y="37" font-size="22" fill="#172554" font-weight="700">执行模式：决策由谁作出，程序怎样推进</text>
<rect x="30" y="70" width="280" height="86" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="98" font-size="18" fill="#172554" font-weight="700">反馈循环</text>
<text x="46" y="125" font-size="16" fill="#172554">当前消息与工具定义</text>
<rect x="30" y="204" width="280" height="100" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="232" font-size="18" fill="#172554" font-weight="700">模型决定</text>
<text x="46" y="259" font-size="16" fill="#172554">回答，或请求工具</text>
<text x="46" y="283" font-size="16" fill="#172554">依据上次观察改变动作</text>
<rect x="30" y="365" width="280" height="96" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="393" font-size="18" fill="#172554" font-weight="700">程序执行工具</text>
<text x="46" y="420" font-size="16" fill="#172554">检查调用，产生结果</text>
<path d="M170,156 V200" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M170,304 V361" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="183" y="337" font-size="14" fill="#172554">工具请求</text>
<path d="M30,410 H14 V254 H26" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="43" y="488" font-size="15" fill="#172554">结果回到下一请求</text>
<path d="M280,304 V538 H170 V566" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="195" y="536" font-size="14" fill="#172554">回答</text>
<rect x="30" y="570" width="280" height="80" rx="9" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="46" y="598" font-size="18" fill="#172554" font-weight="700">结束</text>
<text x="46" y="625" font-size="16" fill="#172554">无后续工作时收口</text>
<rect x="340" y="70" width="280" height="86" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="356" y="98" font-size="18" fill="#172554" font-weight="700">Planner</text>
<text x="356" y="125" font-size="16" fill="#172554">输出可消费的步骤计划</text>
<rect x="340" y="204" width="280" height="100" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="356" y="232" font-size="18" fill="#172554" font-weight="700">Executor</text>
<text x="356" y="259" font-size="16" fill="#172554">接受目标 + 具体步骤</text>
<text x="356" y="283" font-size="16" fill="#172554">内部可再调用模型与工具</text>
<rect x="340" y="365" width="280" height="96" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="356" y="393" font-size="18" fill="#172554" font-weight="700">结果与 Replanner</text>
<text x="356" y="420" font-size="16" fill="#172554">完成则回答，否则修订</text>
<path d="M480,156 V200" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M480,304 V361" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M620,410 H636 V114 H624" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="352" y="488" font-size="15" fill="#172554">步骤结果反馈重规划</text>
<path d="M480,461 V566" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="340" y="570" width="280" height="80" rx="9" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="356" y="598" font-size="18" fill="#172554" font-weight="700">结束</text>
<text x="356" y="625" font-size="16" fill="#172554">计划完成后收口</text>
<rect x="650" y="70" width="280" height="86" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="666" y="98" font-size="18" fill="#172554" font-weight="700">程序定义流程</text>
<text x="666" y="125" font-size="16" fill="#172554">先确定步骤和条件</text>
<rect x="650" y="204" width="280" height="100" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="666" y="232" font-size="18" fill="#172554" font-weight="700">执行节点 A</text>
<text x="666" y="259" font-size="16" fill="#172554">例如：确定的转换处理</text>
<text x="666" y="283" font-size="16" fill="#172554">节点也可含模型调用</text>
<rect x="650" y="365" width="280" height="96" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="666" y="393" font-size="18" fill="#172554" font-weight="700">执行节点 B</text>
<text x="666" y="420" font-size="16" fill="#172554">例如：既定验证和报告</text>
<path d="M790,156 V200" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M790,304 V361" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M790,461 V566" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="662" y="488" font-size="15" fill="#172554">条件与走向由程序组织</text>
<rect x="650" y="570" width="280" height="80" rx="9" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="666" y="598" font-size="18" fill="#172554" font-weight="700">结束</text>
<text x="666" y="625" font-size="16" fill="#172554">规定流程收口</text>
<text x="30" y="704" font-size="17" fill="#172554">组合示意：外层显式计划 → Executor 内层反馈循环；每层有自己的输入与结果。</text>
<text x="30" y="742" font-size="16" fill="#172554">模式不决定是否多 Agent、是否持久化，也不等于产品的 Plan 协作开关。</text>
</g></svg>
