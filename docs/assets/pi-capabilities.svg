<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="802" viewBox="0 0 1100 802" role="img" aria-labelledby="title desc">
<title id="title">外部工具和脚本如何接入同一执行流程</title><desc id="desc">模型直接工具调用和 codemode 脚本的嵌套调用汇入共享工具管线，MCP execute 发起外部协议调用。产品事件交给终端呈现。</desc>
<rect width="1100" height="802" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs>
<g font-family="Arial, sans-serif">
<text x="30" y="36" font-size="23" font-weight="700" fill="#172554">外部工具和脚本如何接入同一执行流程</text>
<rect x="30" y="65" width="475" height="104" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="93" font-size="18" fill="#172554" font-weight="700">模型直接请求工具</text>
<text x="46" y="119" font-size="16" fill="#172554">assistant toolCall</text>
<text x="46" y="143" font-size="16" fill="#172554">名称、参数和调用 ID</text>
<rect x="575" y="65" width="495" height="104" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="591" y="93" font-size="18" fill="#172554" font-weight="700">模型请求 codemode</text>
<text x="591" y="119" font-size="16" fill="#172554">raw JavaScript → QuickJS sandbox</text>
<text x="591" y="143" font-size="16" fill="#172554">脚本 tools.xxx → ctx.executeTool</text>
<polyline points="267,169 267,206 550,206 550,246" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<polyline points="822,169 822,206 550,206" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="285" y="250" width="530" height="104" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="301" y="278" font-size="18" fill="#172554" font-weight="700">共享工具调用管线</text>
<text x="301" y="304" font-size="16" fill="#172554">查找工具 → 校验参数 → tool_call</text>
<text x="301" y="328" font-size="16" fill="#172554">prepared 才 execute；随后 tool_result</text>
<rect x="30" y="439" width="475" height="104" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="467" font-size="18" fill="#172554" font-weight="700">本地工具 execute</text>
<text x="46" y="493" font-size="16" fill="#172554">例如 read / edit / bash</text>
<text x="46" y="517" font-size="16" fill="#172554">返回内容及可选结构化结果</text>
<rect x="575" y="439" width="495" height="104" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="591" y="467" font-size="18" fill="#172554" font-weight="700">MCP 工具 execute</text>
<text x="591" y="493" font-size="16" fill="#172554">McpServerConnection → McpClient</text>
<text x="591" y="517" font-size="16" fill="#172554">stdio / HTTP → 服务端 → 返回结果</text>
<polyline points="415,354 415,395 267,395 267,435" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<polyline points="690,354 690,395 822,395 822,435" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="285" y="628" width="530" height="104" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="301" y="656" font-size="18" fill="#172554" font-weight="700">调用结果回到原调用方</text>
<text x="301" y="682" font-size="16" fill="#172554">直接调用：toolResult 进入后续模型请求</text>
<text x="301" y="706" font-size="16" fill="#172554">脚本调用：toScriptValue 返回脚本，再输出给模型</text>
<polyline points="267,543 267,590 430,590 430,624" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<polyline points="822,543 822,590 670,590 670,624" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="865" y="263" width="205" height="91" rx="9" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="881" y="291" font-size="18" fill="#172554" font-weight="700">终端 UI</text>
<text x="881" y="317" font-size="16" fill="#172554">订阅产品事件</text>
<text x="881" y="341" font-size="16" fill="#172554">显示过程与结果</text>
<polyline points="815,305 860,305" fill="none" stroke="#334155" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="30" y="775" font-size="16" fill="#334155">调用前工具已进入当前 registry；MCP 定义由连接后发现并注册。</text>
</g></svg>
