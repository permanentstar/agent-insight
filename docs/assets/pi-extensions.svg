<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
<title id="title">Pi：定义、运行绑定与实际调用</title><desc id="desc">ResourceLoader 加载 extension、skill、prompt 等定义。AgentSession 创建 ExtensionRunner 并绑定 core 操作。Agent prompt 和工具边界使用当前 runner。reload invalidates 旧 context 后创建新绑定。</desc>
<rect width="1000" height="680" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui,sans-serif" fill="#172554">
<text x="28" y="38" font-size="22" font-weight="700">Pi：定义、运行绑定与实际调用</text>
<rect x="28" y="75" width="600" height="81" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="105" font-size="18" font-weight="700">定义 · ResourceLoader / extension factories</text>
<text x="44" y="132" font-size="15">加载资源与诊断；registerTool 保存 schema 和来源</text>
<rect x="28" y="205" width="600" height="81" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="235" font-size="18" font-weight="700">绑定 · AgentSession → ExtensionRunner</text>
<text x="44" y="262" font-size="15">bindCore + 当前引用；刷新 registry / active loadout</text>
<rect x="28" y="335" width="600" height="81" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="365" font-size="18" font-weight="700">输入 · prompt</text>
<text x="44" y="392" font-size="15">command/input hook → skill/template 展开 → Agent</text>
<rect x="28" y="465" width="600" height="81" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="495" font-size="18" font-weight="700">效果 · Agent tool hooks → execute</text>
<text x="44" y="522" font-size="15">beforeTool 可 block；afterTool 可变换结果</text>
<rect x="745" y="205" width="227" height="107" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="761" y="235" font-size="18" font-weight="700">reload</text>
<text x="761" y="262" font-size="15">shutdown → invalidate</text>
<text x="761" y="288" font-size="15">reload → 新 runner</text>
<rect x="745" y="465" width="227" height="107" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="761" y="495" font-size="18" font-weight="700">状态边界</text>
<text x="761" y="522" font-size="15">注册 ≠ 激活 ≠ 授权</text>
<text x="761" y="548" font-size="15">旧 ctx 失效</text>
<path d="M328,156 V200" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M328,286 V330" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M328,416 V460" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M628,245 H740" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="660" y="235" font-size="14">替换</text>
<text x="28" y="625" font-size="15">Agent hook 在调用时读取当前 runner；旧捕获上下文不随 reload 延续。</text>
<text x="28" y="650" font-size="15">进程内 hook 不自动获得 Pico5 的持久 intent 与重放契约。</text>
</g></svg>
