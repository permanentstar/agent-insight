<svg xmlns="http://www.w3.org/2000/svg" width="920" height="800" viewBox="0 0 920 800" role="img" aria-labelledby="title desc">
<title id="title">扩展 hook：当前绑定与效果边界</title><desc id="desc">前置回调读取当前 runner，依次调用 handler；block 返回 immediate 并阻止 execute。允许执行后，结果 hook 对 currentEvent 累计修改，异常记录后继续。reload 使旧上下文失效。</desc>
<rect width="920" height="800" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="#172554">
<text x="30" y="36" font-size="23" fill="#172554" text-anchor="start" font-weight="700">扩展 hook：当前绑定与效果边界</text>
<rect x="30" y="65" width="560" height="94" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="93" font-size="18" fill="#172554" text-anchor="start" font-weight="700">Agent 的工具回调</text>
<text x="46" y="119" font-size="18" fill="#172554" text-anchor="start">调用时读取 this._extensionRunner</text>
<text x="46" y="145" font-size="18" fill="#172554" text-anchor="start">reload 只更换当前引用，不重新创建执行循环</text>
<rect x="665" y="65" width="225" height="94" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="681" y="93" font-size="18" fill="#172554" text-anchor="start" font-weight="700">reload 更换绑定</text>
<text x="681" y="119" font-size="18" fill="#172554" text-anchor="start">旧 ctx 失效</text>
<text x="681" y="145" font-size="18" fill="#172554" text-anchor="start">新 runner 接回会话</text>
<rect x="30" y="208" width="560" height="94" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="236" font-size="18" fill="#172554" text-anchor="start" font-weight="700">emitToolCall：前置 handler 快照</text>
<text x="46" y="262" font-size="18" fill="#172554" text-anchor="start">逐个 await handler(event, ctx)</text>
<text x="46" y="288" font-size="18" fill="#172554" text-anchor="start">抛错向调用边界传播</text>
<path d="M310,338.0 L580.0,393 L310,448.0 L40.0,393 Z" fill="#fff7ed" stroke="#475569" stroke-width="2"/>
<text x="310" y="399" font-size="17" fill="#172554" text-anchor="middle" font-weight="700">handler 返回 block？</text>
<rect x="665" y="352" width="225" height="84" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="681" y="380" font-size="18" fill="#172554" text-anchor="start" font-weight="700">是：立即返回</text>
<text x="681" y="406" font-size="18" fill="#172554" text-anchor="start">准备结果 immediate</text>
<text x="681" y="432" font-size="18" fill="#172554" text-anchor="start">不执行工具</text>
<rect x="30" y="493" width="560" height="84" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="521" font-size="18" fill="#172554" text-anchor="start" font-weight="700">否则：真实 tool.execute</text>
<text x="46" y="547" font-size="18" fill="#172554" text-anchor="start">效果已经发生，再处理结果</text>
<rect x="30" y="630" width="860" height="110" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="658" font-size="18" fill="#172554" text-anchor="start" font-weight="700">emitToolResult：按 currentEvent 累计修改</text>
<text x="46" y="684" font-size="18" fill="#172554" text-anchor="start">后续 handler 读取前一个修改后的 content / details / isError</text>
<text x="46" y="710" font-size="18" fill="#172554" text-anchor="start">单个 handler 报错：emitError 后继续后续 handler</text>
<path d="M310,159 V204" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M665,109 H594" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="187" font-size="16" fill="#172554" text-anchor="start">更新 current 引用</text>
<path d="M310,302 V334" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M580,393 H661" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="382" font-size="16" fill="#172554" text-anchor="start">是</text>
<path d="M310,448 V489" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="327" y="479" font-size="16" fill="#172554" text-anchor="start">否</text>
<path d="M310,577 V626" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="777" font-size="17" fill="#172554" text-anchor="start">前置拦截与执行后结果变换，处于不同的效果边界。</text>
</g></svg>
