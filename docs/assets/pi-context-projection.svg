<rect x="120" y="85" width="78" height="76" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="130" y="112" font-size="18" fill="#172554" font-weight="700">B</text>
<text x="128" y="141" font-size="14" fill="#172554">r1请求</text>
<path d="M198,121 H206" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="210" y="85" width="78" height="76" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="220" y="112" font-size="18" fill="#172554" font-weight="700">C</text>
<text x="218" y="141" font-size="14" fill="#172554">r1结果</text>
<path d="M288,121 H296" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="300" y="85" width="78" height="76" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="310" y="112" font-size="18" fill="#172554" font-weight="700">E</text>
