<text x="400" y="112" font-size="18" fill="#172554" font-weight="700">F</text>
<text x="398" y="141" font-size="14" fill="#172554">e1请求</text>
<path d="M468,121 H476" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="480" y="85" width="78" height="76" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="490" y="112" font-size="18" fill="#172554" font-weight="700">G</text>
<text x="488" y="141" font-size="14" fill="#172554">e1结果</text>
<path d="M558,121 H566" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="570" y="85" width="78" height="76" rx="8" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="580" y="112" font-size="18" fill="#172554" font-weight="700">S</text>
<text x="578" y="141" font-size="14" fill="#172554">摘要</text>
<path d="M648,121 H656" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="660" y="85" width="78" height="76" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="670" y="112" font-size="18" fill="#172554" font-weight="700">H</text>
<text x="668" y="141" font-size="14" fill="#172554">v1请求</text>
<path d="M738,121 H746" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="750" y="85" width="78" height="76" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="760" y="112" font-size="18" fill="#172554" font-weight="700">I</text>
<text x="758" y="141" font-size="14" fill="#172554">v1结果</text>
<path d="M828,121 H836" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="840" y="85" width="78" height="76" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
