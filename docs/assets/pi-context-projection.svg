<text x="848" y="141" font-size="14" fill="#172554">回答</text>
<text x="30" y="205" font-size="16" fill="#172554">S.parentId=G；firstKeptEntryId=F，包含 F 本身；较早语义由 S 承接。</text>
<text x="30" y="244" font-size="16" fill="#172554">选择的是 J 的祖先路径；旧方向 D 不会因为还在文件里就进入这次请求。</text>
<path d="M606,161 V278 H480 V307" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="311" width="130" height="91" rx="9" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="46" y="339" font-size="18" fill="#172554" font-weight="700">S</text>
<text x="46" y="366" font-size="16" fill="#172554">摘要贡献</text>
<rect x="184" y="311" width="130" height="91" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="200" y="339" font-size="18" fill="#172554" font-weight="700">F</text>
<text x="200" y="366" font-size="16" fill="#172554">e1 请求</text>
<rect x="338" y="311" width="130" height="91" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="354" y="339" font-size="18" fill="#172554" font-weight="700">G</text>
<text x="354" y="366" font-size="16" fill="#172554">e1 结果</text>
<rect x="492" y="311" width="130" height="91" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="508" y="339" font-size="18" fill="#172554" font-weight="700">H</text>
<text x="508" y="366" font-size="16" fill="#172554">v1 请求</text>
<rect x="646" y="311" width="130" height="91" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="662" y="339" font-size="18" fill="#172554" font-weight="700">I</text>
<text x="662" y="366" font-size="16" fill="#172554">v1 结果</text>
<rect x="800" y="311" width="130" height="91" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="816" y="339" font-size="18" fill="#172554" font-weight="700">J</text>
<text x="816" y="366" font-size="16" fill="#172554">回答</text>
<text x="30" y="450" font-size="17" fill="#172554">下方是模型上下文的 Entry 顺序，原始历史及 parent 关系不被改写。</text>
<text x="30" y="492" font-size="16" fill="#172554">摘要承担旧语义；详细保留段与新增内容继续维持调用／结果配对。</text>
</g></svg>
