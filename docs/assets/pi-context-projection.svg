<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Pi 压缩投影：同一案例的摘要、保留和新增</title><desc id="desc">当前路径A B C E F G S H I J；S.firstKept=F，F/G为修改调用及结果，H/I为新验证调用及结果；上下文Entry为S F G H I J，D不在当前路径。</desc>
<rect width="960" height="520" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="#172554">
<text x="30" y="37" font-size="22" fill="#172554" font-weight="700">Pi 压缩投影：同一案例的摘要、保留和新增</text>
<rect x="30" y="85" width="78" height="76" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="40" y="112" font-size="18" fill="#172554" font-weight="700">A</text>
<text x="38" y="141" font-size="14" fill="#172554">目标</text>
