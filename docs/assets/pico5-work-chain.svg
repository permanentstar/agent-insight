<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc">
<title id="title">Pico5：一份输入，多个生成与工具任务</title><desc id="desc">S1 作为同一用户输入由 G1 读取、G2 修改、G3 验证、G4 回答推进；工具是生成 child，pi.live.run.taskId 随生成移交，最终结束 S1。</desc>
<rect width="960" height="630" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="#172554">
<text x="30" y="37" font-size="22" fill="#172554" font-weight="700">Pico5：一份输入，多个生成与工具任务</text>
<rect x="30" y="68" width="900" height="86" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="96" font-size="18" fill="#172554" font-weight="700">Submission S1 · 同一个用户目标</text>
<text x="46" y="123" font-size="16" fill="#172554">读资料，修复 CSV 转义，运行验证并说明结果</text>
<rect x="30" y="218" width="180" height="100" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="246" font-size="18" fill="#172554" font-weight="700">G1 · 获取事实</text>
<text x="46" y="273" font-size="16" fill="#172554">工具返回代码</text>
<path d="M210,258 H266" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="270" y="218" width="180" height="100" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="286" y="246" font-size="18" fill="#172554" font-weight="700">G2 · 修改</text>
<text x="286" y="273" font-size="16" fill="#172554">工具返回修改结果</text>
<path d="M450,258 H506" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="510" y="218" width="180" height="100" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="526" y="246" font-size="18" fill="#172554" font-weight="700">G3 · 验证</text>
<text x="526" y="273" font-size="16" fill="#172554">工具返回验证结果</text>
<path d="M690,258 H746" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="750" y="218" width="180" height="100" rx="9" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="766" y="246" font-size="18" fill="#172554" font-weight="700">G4 · 回答</text>
<text x="766" y="273" font-size="16" fill="#172554">收口 S1 为 done</text>
<rect x="30" y="383" width="180" height="82" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="411" font-size="18" fill="#172554" font-weight="700">T1 · read</text>
<text x="46" y="438" font-size="16" fill="#172554">child of G1</text>
<path d="M120,318 V379" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="270" y="383" width="180" height="82" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="286" y="411" font-size="18" fill="#172554" font-weight="700">T2 · edit</text>
<text x="286" y="438" font-size="16" fill="#172554">child of G2</text>
<path d="M360,318 V379" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="510" y="383" width="180" height="82" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="526" y="411" font-size="18" fill="#172554" font-weight="700">T3 · bash</text>
<text x="526" y="438" font-size="16" fill="#172554">child of G3</text>
<path d="M600,318 V379" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="42" y="355" font-size="14" fill="#172554">创建并等待</text>
<text x="282" y="355" font-size="14" fill="#172554">创建并等待</text>
<text x="522" y="355" font-size="14" fill="#172554">创建并等待</text>
<rect x="30" y="511" width="900" height="86" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="539" font-size="18" fill="#172554" font-weight="700">pi.live.run 的归属移动</text>
<text x="46" y="566" font-size="16" fill="#172554">taskId: G1 → G2 → G3 → G4；inputs 一直包含 S1，直到 endRun</text>
<text x="30" y="197" font-size="16" fill="#172554">正常轨迹示意：模型决定每轮动作；读、改、验证不是固定必经步骤。</text>
</g></svg>
