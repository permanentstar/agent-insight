<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="883" viewBox="0 0 1000 883" role="img" aria-labelledby="title desc">
<title id="title">一次输入：运行、记录与产品收口</title><desc id="desc">空闲普通输入由产品准备，内核请求模型并执行工具，在轮次边界判断继续；完整消息事件贯穿这些步骤写入历史。内核结束后产品还可继续，最终发布 agent_settled。</desc>
<rect width="1000" height="883" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs>
<g font-family="Arial, sans-serif">
<text x="30" y="36" font-size="23" font-weight="700" fill="#172554">一次输入：运行、记录与产品收口</text>
<rect x="45" y="65" width="580" height="104" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="61" y="93" font-size="18" fill="#172554" font-weight="700">1. 产品处理空闲普通输入</text>
<text x="61" y="119" font-size="16" fill="#172554">输入处理 → skill/template 展开</text>
<text x="61" y="143" font-size="16" fill="#172554">模型、认证、压缩检查 → before_agent_start</text>
<polyline points="335,169 335,217" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="45" y="221" width="580" height="104" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="61" y="249" font-size="18" fill="#172554" font-weight="700">2. 准备请求并取得模型响应</text>
<text x="61" y="275" font-size="16" fill="#172554">轮次准备 → 接纳消息与工具声明</text>
<text x="61" y="299" font-size="16" fill="#172554">prepareRequest → 转换 → 模型响应</text>
<polyline points="335,325 335,373" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="45" y="377" width="580" height="104" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="61" y="405" font-size="18" fill="#172554" font-weight="700">3. 有工具调用时执行</text>
<text x="61" y="431" font-size="16" fill="#172554">参数检查 → tool_call → execute</text>
<text x="61" y="455" font-size="16" fill="#172554">tool_result → 返回观察</text>
<polyline points="335,481 335,529" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="45" y="533" width="580" height="104" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="61" y="561" font-size="18" fill="#172554" font-weight="700">5. 轮次结束后判断继续</text>
<text x="61" y="587" font-size="16" fill="#172554">finishTurn 内先处理扩展 turn_end</text>
<text x="61" y="611" font-size="16" fill="#172554">工具/steering/followUp/继续要求 → 新请求</text>
<polyline points="335,637 335,685" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="45" y="689" width="580" height="104" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="61" y="717" font-size="18" fill="#172554" font-weight="700">产品后处理与最终收口</text>
<text x="61" y="743" font-size="16" fill="#172554">agent_end → 监听者完成 → activeRun 释放</text>
<text x="61" y="767" font-size="16" fill="#172554">后处理 / agent_before_settle → continue 或 settled</text>
<rect x="700" y="221" width="270" height="128" rx="9" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="716" y="249" font-size="18" fill="#172554" font-weight="700">4. 完整消息接回历史</text>
<text x="716" y="275" font-size="16" fill="#172554">贯穿输入、响应与工具结果</text>
<text x="716" y="299" font-size="16" fill="#172554">message_end → AgentSession</text>
<text x="716" y="323" font-size="16" fill="#172554">→ SessionManager.appendMessage</text>
<polyline points="625,269 695,269" fill="none" stroke="#334155" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<polyline points="625,425 664,425 664,325 695,325" fill="none" stroke="#334155" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="700" y="455" width="270" height="104" rx="9" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="716" y="483" font-size="18" fill="#172554" font-weight="700">运行中的追加输入</text>
<text x="716" y="509" font-size="16" fill="#172554">steering 在轮次边界消费</text>
<text x="716" y="533" font-size="16" fill="#172554">followUp 在自然停止后消费</text>
<polyline points="700,507 630,507" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<polyline points="45,586 20,586 20,269 40,269" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="26" y="467" font-size="16" fill="#334155">续跑</text>
<polyline points="625,741 660,741 660,210 335,210 335,216" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="682" y="710" font-size="16" fill="#334155">Agent.continue</text>
<polyline points="625,293 677,293 677,574 630,574" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="680" y="596" font-size="16" fill="#334155">无工具调用</text>
<text x="45" y="844" font-size="16" fill="#334155">正常收口终点：agent_settled；输入被接管或入队时在产品输入阶段返回。</text>
</g></svg>
