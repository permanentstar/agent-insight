<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc">
  <title id="title">Hermes：会话、消息与读取投影</title>
  <desc id="desc">SessionDB 保存原生会话资料；memory provider 自行负责长期记忆的持久化。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="580" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif" fill="#0f172a">
    <text x="35" y="38" font-size="24" font-weight="700">Hermes：会话、消息与读取投影</text>
    <text x="35" y="68" font-size="16">SessionDB 保存原生会话资料；memory provider 自行负责长期记忆的持久化。</text>
    <path d="M345 165H395" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="342.0" y="134" width="56" height="23" fill="#ffffff"/>
    <text x="370" y="151" font-size="15" text-anchor="middle">1 : N</text>
    <path d="M705 165H755" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M550 225V355" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M630 225V285H910V355" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="759.5" y="260" width="91" height="23" fill="#ffffff"/>
    <text x="805" y="277" font-size="15" text-anchor="middle">另一种读取</text>
    <path d="M345 415H395" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="332.0" y="380" width="76" height="23" fill="#ffffff"/>
    <text x="370" y="397" font-size="15" text-anchor="middle">补充资料</text>
    <rect x="35" y="105" width="310" height="120" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="50" y="134" font-size="19" font-weight="650">sessions</text>
    <text x="50" y="161" font-size="16">id / parent_session_id</text>
    <text x="50" y="185" font-size="16">end_reason 等</text>
    <text x="50" y="209" font-size="16">来历不自动等于压缩续接</text>
    <rect x="395" y="105" width="310" height="120" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="410" y="134" font-size="19" font-weight="650">messages</text>
    <text x="410" y="161" font-size="16">id / session_id / role / content</text>
    <text x="410" y="185" font-size="16">active / compacted；工具资料</text>
    <text x="410" y="209" font-size="16">API 与展示专用字段</text>
    <rect x="755" y="105" width="310" height="120" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="770" y="134" font-size="19" font-weight="650">工具交换的内部关联</text>
    <text x="770" y="161" font-size="16">tool_calls / tool_call_id</text>
    <text x="770" y="185" font-size="16">tool_call_uids / tool_call_uid</text>
    <text x="770" y="209" font-size="16">与消息行 ID 分开</text>
    <rect x="35" y="355" width="310" height="120" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="50" y="384" font-size="19" font-weight="650">独立长期 memory</text>
    <text x="50" y="411" font-size="16">provider 自有资料与存储</text>
    <text x="50" y="435" font-size="16">按 hooks 交给请求组织</text>
    <text x="50" y="459" font-size="16">不从 messages 表推定 schema</text>
    <rect x="395" y="355" width="310" height="120" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="410" y="384" font-size="19" font-weight="650">模型恢复</text>
    <text x="410" y="411" font-size="16">当前压缩段的 active 行</text>
    <text x="410" y="435" font-size="16">解码为有效对话</text>
    <text x="410" y="459" font-size="16">经请求组织后供模型使用</text>
    <rect x="755" y="355" width="310" height="120" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="770" y="384" font-size="19" font-weight="650">展示恢复</text>
    <text x="770" y="411" font-size="16">合法压缩链与归档资料</text>
    <text x="770" y="435" font-size="16">active 或 compacted 的展示集</text>
    <text x="770" y="459" font-size="16">合并、去重后供宿主展示</text>
    <text x="35" y="540" font-size="16">in-place 压缩保留旧行并插入候选；rotated 压缩建立新 session 与合法续接关系。</text>
  </g>
</svg>
