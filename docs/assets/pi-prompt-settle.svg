<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
<title id="title">Pi 的内核运行与产品收口</title>
<desc id="desc">产品 AgentSession 的一次 prompt 首先 await Agent.prompt。内核多个 turn 结束后发 agent_end，等待事件监听者并释放 activeRun。产品随后检查后处理和 before-settle 边界，若有后续工作则 Agent.continue 再进入内核；没有后续工作时 flush pending 消息并发 agent_settled。</desc>
<rect width="960" height="570" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="#172554">
<text x="30" y="38" font-size="22" font-weight="700">产品 prompt 的范围，大于一次内核运行</text>
<rect x="30" y="64" width="660" height="220" rx="10" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="48" y="93" font-size="18" font-weight="700">Agent：一个 activeRun</text>
<text x="48" y="123" font-size="17">runLoop：模型响应 / 工具结果 / steering / followUp</text>
<text x="48" y="153" font-size="16">每轮发布 turn_end；仍可进入下一轮</text>
<text x="48" y="190" font-size="18" font-weight="700">agent_end：本次内核不再产生循环事件</text>
<text x="48" y="220" font-size="16">await 事件监听者完成 → finishRun() 释放 activeRun</text>
<text x="48" y="250" font-size="16">随后 Agent.prompt / Agent.continue 的 await 返回</text>
<path d="M350,284 V324" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="30" y="330" width="660" height="100" rx="10" fill="#fff7ed" stroke="#475569" stroke-width="2"/>
<text x="48" y="360" font-size="18" font-weight="700">AgentSession：产品后处理与收口边界</text>
<text x="48" y="390" font-size="16">_handlePostAgentRun() / _runBeforeSettleBoundary()</text>
<text x="48" y="414" font-size="16">产品有后续工作时调用 Agent.continue()</text>
<path d="M690,380 H760 V175 H695" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="780" y="265" font-size="16">仍需继续</text>
<text x="780" y="291" font-size="16">新的 activeRun</text>
<path d="M350,430 V474" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="380" y="459" font-size="15">不再续跑 / 已停止</text>
<rect x="30" y="480" width="660" height="66" rx="10" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="48" y="506" font-size="18" font-weight="700">flush pending 消息 → agent_settled</text>
<text x="48" y="533" font-size="16">产品收口事件；不替代对工具实际结果的核验</text>
</g></svg>
