<svg xmlns="http://www.w3.org/2000/svg" width="960" height="645" viewBox="0 0 960 645" role="img" aria-labelledby="title desc">
<title id="title">Pi 历史树：同一案例的两条方向</title><desc id="desc">A目标、B读取调用r1、C读取结果；D旧方向说明与E新输入都从C接出；E到F修改调用e1、G修改结果，当前leaf为G，当前路径排除D。</desc>
<rect width="960" height="645" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="#172554">
<text x="30" y="37" font-size="22" fill="#172554" font-weight="700">Pi 历史树：同一案例的两条方向</text>
<rect x="30" y="76" width="230" height="88" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="104" font-size="18" fill="#172554" font-weight="700">A · 用户目标</text>
<text x="46" y="131" font-size="16" fill="#172554">修复 CSV 并验证</text>
<rect x="335" y="76" width="230" height="88" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="351" y="104" font-size="18" fill="#172554" font-weight="700">B · assistant</text>
<text x="351" y="131" font-size="16" fill="#172554">读取调用 r1</text>
<rect x="685" y="76" width="245" height="88" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="701" y="104" font-size="18" fill="#172554" font-weight="700">C · toolResult</text>
<text x="701" y="131" font-size="16" fill="#172554">r1 的代码观察</text>
<path d="M260,120 H331" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M565,120 H681" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="685" y="254" width="245" height="88" rx="9" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="701" y="282" font-size="18" fill="#172554" font-weight="700">D · assistant</text>
<text x="701" y="309" font-size="16" fill="#172554">旧方向的说明</text>
<rect x="30" y="254" width="230" height="88" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="282" font-size="18" fill="#172554" font-weight="700">E · user</text>
<text x="46" y="309" font-size="16" fill="#172554">从 C 尝试新方向</text>
<rect x="335" y="254" width="230" height="88" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="351" y="282" font-size="18" fill="#172554" font-weight="700">F · assistant</text>
<text x="351" y="309" font-size="16" fill="#172554">修改调用 e1</text>
<rect x="685" y="443" width="245" height="88" rx="9" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="701" y="471" font-size="18" fill="#172554" font-weight="700">G · toolResult</text>
<text x="701" y="498" font-size="16" fill="#172554">e1 结果；当前 leaf</text>
<path d="M835,164 V250" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="845" y="216" font-size="14" fill="#172554">旧方向</text>
<path d="M710,164 V205 H145 V250" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="390" y="231" font-size="15" fill="#172554">从 C 接出另一条路径</text>
<path d="M260,298 H331" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M450,342 V395 H807 V439" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="555" width="900" height="72" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="583" font-size="18" fill="#172554" font-weight="700">当前路径</text>
<text x="46" y="610" font-size="16" fill="#172554">A、B、C、E、F、G；D 保留在历史里，不属于 G 的祖先路径</text>
</g></svg>
