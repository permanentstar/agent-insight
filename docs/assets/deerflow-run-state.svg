<svg xmlns="http://www.w3.org/2000/svg" width="960" height="665" viewBox="0 0 960 665" role="img" aria-labelledby="title desc">
<title id="title">DeerFlow Run：生命周期与执行归属</title><desc id="desc">pending 经 try_start 进入 running，工作执行与收口后 success 或 error；取消可以在 pending 或 running 标记 interrupted；ownership_lost 是独立归属标记，timeout 是声明的终态类型。</desc>
<rect width="960" height="665" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="#172554">
<text x="30" y="37" font-size="22" fill="#172554" font-weight="700">DeerFlow Run：生命周期与执行归属</text>
<rect x="30" y="78" width="250" height="108" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="106" font-size="18" fill="#172554" font-weight="700">pending</text>
<text x="46" y="133" font-size="16" fill="#172554">已接纳本次工作</text>
<text x="46" y="157" font-size="16" fill="#172554">尚未开始构图执行</text>
<rect x="390" y="78" width="540" height="108" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="406" y="106" font-size="18" fill="#172554" font-weight="700">running</text>
<text x="406" y="133" font-size="16" fill="#172554">try_start 确认启动，worker 执行图</text>
<text x="406" y="157" font-size="16" fill="#172554">多次模型／工具推进都在同一 run 内</text>
<path d="M280,132 H386" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="293" y="119" font-size="15" fill="#172554">开始</text>
<rect x="390" y="326" width="245" height="103" rx="9" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="406" y="354" font-size="18" fill="#172554" font-weight="700">success</text>
<text x="406" y="381" font-size="16" fill="#172554">worker 正常收口</text>
<text x="406" y="405" font-size="16" fill="#172554">有输出交付条件时一并检查</text>
<rect x="685" y="326" width="245" height="103" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="701" y="354" font-size="18" fill="#172554" font-weight="700">error</text>
<text x="701" y="381" font-size="16" fill="#172554">启动或执行／交付失败</text>
<text x="701" y="405" font-size="16" fill="#172554">保存具名错误</text>
<path d="M510,186 V322" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M807,186 V322" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M155,186 V260 H807 V322" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="326" width="250" height="103" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="354" font-size="18" fill="#172554" font-weight="700">interrupted</text>
<text x="46" y="381" font-size="16" fill="#172554">取消／中断控制</text>
<text x="46" y="405" font-size="16" fill="#172554">不表示外部效果回滚</text>
<path d="M93,186 V322" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M390,165 H320 V377 H284" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="498" width="900" height="115" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="526" font-size="18" fill="#172554" font-weight="700">与 status 分开的归属资料</text>
<text x="46" y="553" font-size="16" fill="#172554">owner / lease / ownership_lost：决定当前 worker 能否提交终态</text>
<text x="46" y="577" font-size="16" fill="#172554">取消与完成先后由对应存储契约判断，旧 owner 不能只凭本地状态宣称成功</text>
<text x="46" y="601" font-size="16" fill="#172554">timeout 是 RunStatus 声明的另一终态；本图未假定默认超时触发策略</text>
</g></svg>
