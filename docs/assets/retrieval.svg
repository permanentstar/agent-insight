<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img">
<title>RAG：索引路径与两种查询控制权</title>
<rect width="960" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs>
<text x="32" y="40" font-family="sans-serif" font-size="24" font-weight="700" fill="#172554">RAG：索引路径与两种查询控制权</text>
<rect x="32" y="65" width="896" height="110" rx="12" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="54" y="94" font-family="sans-serif" font-size="21" font-weight="700" fill="#172554">索引准备</text>
<text x="54" y="124" font-family="sans-serif" font-size="19" fill="#172554">读取来源 → Document → 切分 → embed_documents → store</text>
<text x="54" y="154" font-family="sans-serif" font-size="17" fill="#334155">来源 metadata、embedding 契约与索引版本由应用维护</text>
<path d="M480 177V195" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="197" width="896" height="110" rx="12" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="54" y="226" font-family="sans-serif" font-size="21" font-weight="700" fill="#172554">查询与召回</text>
<text x="54" y="256" font-family="sans-serif" font-size="19" fill="#172554">question → Retriever → 搜索模式 → list[Document]</text>
<text x="54" y="286" font-family="sans-serif" font-size="17" fill="#334155">可以向量、关键词或外部搜索；接口不保证相关性</text>
<path d="M480 309V327" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="329" width="896" height="110" rx="12" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="54" y="358" font-family="sans-serif" font-size="21" font-weight="700" fill="#172554">生成控制</text>
<text x="54" y="388" font-family="sans-serif" font-size="19" fill="#172554">固定链：检索后模型 / Agentic：模型调检索工具后继续</text>
<text x="54" y="418" font-family="sans-serif" font-size="17" fill="#334155">资料信任、引用及执行预算由应用约束</text>
<text x="32" y="478" font-family="sans-serif" font-size="16" fill="#334155">固定源码基线的静态分析；没有运行模型、索引服务或 tracing 后端。</text>
</svg>
