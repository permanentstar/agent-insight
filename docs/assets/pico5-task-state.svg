<svg xmlns="http://www.w3.org/2000/svg" width="960" height="815" viewBox="0 0 960 815" role="img" aria-labelledby="title desc">
<title id="title">Pico5 Task：调度状态与恢复</title><desc id="desc">pending 被认领为 running；running 可提交新 checkpoint 或 waiting，waiting 满足等待条件后重新认领；终态可能先 completing 等待 owned work；重开时 running 回 pending。</desc>
<rect width="960" height="815" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="#172554">
<text x="30" y="37" font-size="22" fill="#172554" font-weight="700">Pico5 Task：调度状态与恢复</text>
<rect x="30" y="85" width="255" height="104" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="113" font-size="18" fill="#172554" font-weight="700">pending</text>
<text x="46" y="140" font-size="16" fill="#172554">具备 checkpoint</text>
<text x="46" y="164" font-size="16" fill="#172554">尚未被 invocation 认领</text>
<rect x="375" y="85" width="340" height="104" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="391" y="113" font-size="18" fill="#172554" font-weight="700">running</text>
<text x="391" y="140" font-size="16" fill="#172554">当前 invocation 持有</text>
<text x="391" y="164" font-size="16" fill="#172554">phase 决定任务代码做哪一步</text>
<path d="M285,136 H371" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="300" y="123" font-size="15" fill="#172554">认领</text>
<path d="M500,85 V59 H158 V81" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="238" y="75" font-size="14" fill="#172554">重开：保留 checkpoint，重新调度</text>
<rect x="375" y="310" width="340" height="104" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="391" y="338" font-size="18" fill="#172554" font-weight="700">waiting</text>
<text x="391" y="365" font-size="16" fill="#172554">没有 invocation</text>
<text x="391" y="389" font-size="16" fill="#172554">等待指定 Task 结果</text>
<path d="M485,189 V306" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="391" y="254" font-size="15" fill="#172554">提交 wait</text>
<path d="M660,310 V193" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="687" y="254" font-size="15" fill="#172554">条件满足，认领</text>
<path d="M715,136 H775 V203 H715" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="786" y="153" font-size="14" fill="#172554">新</text>
<text x="786" y="177" font-size="14" fill="#172554">checkpoint</text>
<rect x="30" y="491" width="255" height="112" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="519" font-size="18" fill="#172554" font-weight="700">completing</text>
<text x="46" y="546" font-size="16" fill="#172554">outcome 已决定</text>
<text x="46" y="570" font-size="16" fill="#172554">等普通 owned work 结束</text>
<rect x="375" y="620" width="340" height="104" rx="9" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="391" y="648" font-size="18" fill="#172554" font-weight="700">terminal</text>
<text x="391" y="675" font-size="16" fill="#172554">持久 outcome 回执</text>
<text x="391" y="699" font-size="16" fill="#172554">不再执行任务代码</text>
<path d="M375,176 H320 V547 H289" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="451" font-size="15" fill="#172554">有 owned work 未收口</text>
<path d="M285,547 H345 V672 H371" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="644" font-size="15" fill="#172554">下属已收口</text>
<path d="M715,174 H910 V672 H719" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="748" y="586" font-size="15" fill="#172554">无须等下属，直接结束</text>
<text x="30" y="774" font-size="18" fill="#172554" font-weight="700">Task status ≠ checkpoint.phase ≠ pi.live 展示状态。</text>
</g></svg>
