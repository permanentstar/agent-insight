<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="565" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">DeerFlow：产品接入、Agent 装配与框架执行</title>
<desc id="desc">入口 · Gateway run / 嵌入式 Client：Gateway 管理 run；Client 是独立调用入口，不包装 HTTP Gateway；产品组合 · assemble_lead_agent / _ensure_agent：解析模型、工具、skills、prompt 与 middleware；框架构图 · LangChain create_agent：编译 model、tools、hook 节点；图实例不是持久 thread；框架执行 · LangGraph stream / astream：按 thread_id 读写状态；provider 与 tool handler 产生效果；Gateway 每个 run 构图；Client 按配置复用图。存储与外部效果不在一个事务。</desc>
<rect width="1000" height="565" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui,sans-serif" fill="#172554">
<text x="28" y="37" font-size="22" font-weight="700">DeerFlow：产品接入、Agent 装配与框架执行</text>
<rect x="28" y="65" width="590" height="80" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="93" font-size="18" font-weight="700">入口 · Gateway run / 嵌入式 Client</text>
<text x="44" y="123" font-size="15">Gateway 管理 run；Client 是独立调用入口，不包装 HTTP Gateway</text>
<path d="M310,145 V166" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="170" width="590" height="80" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="198" font-size="18" font-weight="700">产品组合 · assemble_lead_agent / _ensure_agent</text>
<text x="44" y="228" font-size="15">解析模型、工具、skills、prompt 与 middleware</text>
<path d="M310,250 V271" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="275" width="590" height="80" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="303" font-size="18" font-weight="700">框架构图 · LangChain create_agent</text>
<text x="44" y="333" font-size="15">编译 model、tools、hook 节点；图实例不是持久 thread</text>
<path d="M310,355 V376" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="380" width="590" height="80" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="408" font-size="18" font-weight="700">框架执行 · LangGraph stream / astream</text>
<text x="44" y="438" font-size="15">按 thread_id 读写状态；provider 与 tool handler 产生效果</text>
<rect x="726" y="65" width="246" height="95" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="742" y="94" font-size="17" font-weight="700">RunManager / RunStore</text>
<text x="742" y="120" font-size="15">接纳、执行所有权、取消</text>
<text x="742" y="145" font-size="15">run 状态与终态</text>
<path d="M618,105 H720" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="631" y="93" font-size="14">读写 / 绑定</text>
<rect x="726" y="380" width="246" height="95" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="742" y="409" font-size="17" font-weight="700">checkpoint / 事件存储</text>
<text x="742" y="435" font-size="15">checkpoint 用于图恢复</text>
<text x="742" y="460" font-size="15">事件流与 thread 元信息另存</text>
<path d="M618,420 H720" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="631" y="408" font-size="14">读写 / 绑定</text>
<text x="28" y="538" font-size="15">Gateway 每个 run 构图；Client 按配置复用图。存储与外部效果不在一个事务。</text>
</g></svg>
