<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="565" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">LangGraph：从图定义到超步与持久恢复</title>
<desc id="desc">构图 · StateGraph.compile：schema、reducer、node、edge 形成 CompiledStateGraph；每次调用 · Pregel.stream / astream：装载 checkpoint 与 channels；建立本次 PregelLoop；调度 · loop.tick → runner.atick：选任务并执行；当前超步内读取的通道值稳定；合并 · after_tick / checkpoint：节点 writes 过 reducer；下一超步才看到更新；interrupt 恢复会重跑节点；节点先前做的外部效果须由应用负责幂等或核验。</desc>
<rect width="1000" height="565" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui,sans-serif" fill="#172554">
<text x="28" y="37" font-size="22" font-weight="700">LangGraph：从图定义到超步与持久恢复</text>
<rect x="28" y="65" width="590" height="80" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="93" font-size="18" font-weight="700">构图 · StateGraph.compile</text>
<text x="44" y="123" font-size="15">schema、reducer、node、edge 形成 CompiledStateGraph</text>
<path d="M310,145 V166" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="170" width="590" height="80" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="198" font-size="18" font-weight="700">每次调用 · Pregel.stream / astream</text>
<text x="44" y="228" font-size="15">装载 checkpoint 与 channels；建立本次 PregelLoop</text>
<path d="M310,250 V271" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="275" width="590" height="80" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="303" font-size="18" font-weight="700">调度 · loop.tick → runner.atick</text>
<text x="44" y="333" font-size="15">选任务并执行；当前超步内读取的通道值稳定</text>
<path d="M310,355 V376" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="380" width="590" height="80" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="408" font-size="18" font-weight="700">合并 · after_tick / checkpoint</text>
<text x="44" y="438" font-size="15">节点 writes 过 reducer；下一超步才看到更新</text>
<rect x="726" y="170" width="246" height="95" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="742" y="199" font-size="17" font-weight="700">checkpointer / store</text>
<text x="742" y="225" font-size="15">thread_id / namespace 定位</text>
<text x="742" y="250" font-size="15">store 是独立跨调用数据</text>
<path d="M618,210 H720" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="631" y="198" font-size="14">读写 / 绑定</text>
<rect x="726" y="380" width="246" height="95" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="742" y="409" font-size="17" font-weight="700">checkpoint / writes</text>
<text x="742" y="435" font-size="15">channel_values / versions</text>
<text x="742" y="460" font-size="15">保存后按条件重新调度</text>
<path d="M618,420 H720" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="631" y="408" font-size="14">读写 / 绑定</text>
<text x="28" y="538" font-size="15">interrupt 恢复会重跑节点；节点先前做的外部效果须由应用负责幂等或核验。</text>
</g></svg>
