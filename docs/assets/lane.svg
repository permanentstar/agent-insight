<svg xmlns="http://www.w3.org/2000/svg" width="920" height="562" viewBox="0 0 920 562" role="img" aria-labelledby="title"><title id="title">Lane Harness：冻结基线的概念层次</title><rect width="920" height="562" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker></defs><g font-family="system-ui, sans-serif" fill="#172554"><text x="30" y="40" font-size="22" font-weight="700">Lane Harness：冻结基线的概念层次</text><rect x="30" y="62" width="860" height="70" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/><text x="48" y="89" font-size="17" font-weight="700">产品与远程接入 · experimental client / server / Worker</text><text x="48" y="115" font-size="15">Worker 为一个 Session 构造 Harness；Presentation 通过 Service 调用</text><path d="M460,132 V153" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="156" width="860" height="70" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/><text x="48" y="183" font-size="17" font-weight="700">运行门面 · AgentHarness → Lane</text><text x="48" y="209" font-size="15">Harness 取得按名称划分的处理道；Lane 接纳并串行提交命令</text><path d="M460,226 V247" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="250" width="860" height="70" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/><text x="48" y="277" font-size="17" font-weight="700">持久工作 · Operation / OperationState</text><text x="48" y="303" font-size="15">工作身份与当前位置持久保存；不是内存 Promise 或一次模型 turn</text><path d="M460,320 V341" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="344" width="860" height="70" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/><text x="48" y="371" font-size="17" font-weight="700">内存推进 · Drive → phase procedure</text><text x="48" y="397" font-size="15">读取状态分支，准备输入、提交 intent、执行副作用、提交 outcome</text><path d="M460,414 V435" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="438" width="860" height="70" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/><text x="48" y="465" font-size="17" font-weight="700">存储与发布 · Session mutation line / Storage</text><text x="48" y="491" font-size="15">事务提交后采用 Lane state，再发布事件；恢复创建新的 Drive</text></g></svg>
