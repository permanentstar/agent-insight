<svg xmlns="http://www.w3.org/2000/svg" width="960" height="875" viewBox="0 0 960 875" role="img" aria-labelledby="title desc">
<title id="title">Codex：一个 Turn 内多次 Step</title><desc id="desc">输入建立任务与 TurnContext；每次模型请求捕获 StepContext，工具结果回到历史；待处理输入和 Stop hooks 可以要求继续；无后续工作时收口任务。</desc>
<rect width="960" height="875" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="#172554">
<text x="30" y="37" font-size="22" fill="#172554" font-weight="700">Codex：一个 Turn 内多次 Step</text>
<rect x="30" y="75" width="900" height="90" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="103" font-size="18" fill="#172554" font-weight="700">输入操作 → RegularTask → run_turn</text>
<text x="46" y="130" font-size="16" fill="#172554">线程保持存活；当前任务绑定 TurnContext 和取消控制</text>
<rect x="30" y="214" width="585" height="98" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="242" font-size="18" fill="#172554" font-weight="700">请求边界 · StepContext</text>
<text x="46" y="269" font-size="16" fill="#172554">同一次捕获模型、工具与环境</text>
<text x="46" y="293" font-size="16" fill="#172554">ContextManager 形成当次 history 投影</text>
<rect x="30" y="365" width="585" height="98" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="393" font-size="18" fill="#172554" font-weight="700">采样与工具</text>
<text x="46" y="420" font-size="16" fill="#172554">ModelClientSession.stream → ToolRouter / handler</text>
<text x="46" y="444" font-size="16" fill="#172554">结果加入活跃历史并交 rollout 写入</text>
<rect x="30" y="524" width="585" height="108" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="552" font-size="18" fill="#172554" font-weight="700">是否继续？</text>
<text x="46" y="579" font-size="16" fill="#172554">模型需要反馈，或有待处理输入 → 下一 Step</text>
<text x="46" y="603" font-size="16" fill="#172554">否则调用 Stop hooks</text>
<rect x="690" y="524" width="240" height="108" rx="9" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="706" y="552" font-size="18" fill="#172554" font-weight="700">Stop hooks</text>
<text x="706" y="579" font-size="16" fill="#172554">要求继续：回填片段</text>
<text x="706" y="603" font-size="16" fill="#172554">通过：收口</text>
<path d="M480,165 V188 H322 V210" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M322,312 V361" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M322,463 V520" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M30,579 H13 V264 H26" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M615,579 H686" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M810,524 V264 H619" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="711" width="900" height="102" rx="9" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="46" y="739" font-size="18" fill="#172554" font-weight="700">当前任务结束</text>
<text x="46" y="766" font-size="16" fill="#172554">active turn 释放；线程可接收后续用户轮次</text>
<text x="46" y="790" font-size="16" fill="#172554">rollout 写入确认与 UI 事件分别观察</text>
<path d="M810,632 V707" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="856" font-size="16" fill="#172554">这是 run_turn 的控制阶段；不是新增统一的持久 Task 状态枚举。</text>
</g></svg>
