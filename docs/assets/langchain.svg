<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="565" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">LangChain：组合协议、Agent 构图与实际调用</title>
<desc id="desc">应用组合 · create_agent：输入 model / tools / middleware / state schema；图定义 · model、tools、hook 节点与边：before 顺序、after 反序；wrap 首项在最外层；执行门面 · CompiledStateGraph：LangGraph 调度；Runnable invoke / stream 等统一接口；效果 · BaseChatModel / BaseTool：partner 模型请求与 tool._run；权限由应用/执行环境提供；create_agent 是构图工厂，运行调度和 checkpoint 归 LangGraph；框架主干不等于应用依赖。</desc>
<rect width="1000" height="565" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui,sans-serif" fill="#172554">
<text x="28" y="37" font-size="22" font-weight="700">LangChain：组合协议、Agent 构图与实际调用</text>
<rect x="28" y="65" width="590" height="80" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="93" font-size="18" font-weight="700">应用组合 · create_agent</text>
<text x="44" y="123" font-size="15">输入 model / tools / middleware / state schema</text>
<path d="M310,145 V166" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="170" width="590" height="80" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="198" font-size="18" font-weight="700">图定义 · model、tools、hook 节点与边</text>
<text x="44" y="228" font-size="15">before 顺序、after 反序；wrap 首项在最外层</text>
<path d="M310,250 V271" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="275" width="590" height="80" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="303" font-size="18" font-weight="700">执行门面 · CompiledStateGraph</text>
<text x="44" y="333" font-size="15">LangGraph 调度；Runnable invoke / stream 等统一接口</text>
<path d="M310,355 V376" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="380" width="590" height="80" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="408" font-size="18" font-weight="700">效果 · BaseChatModel / BaseTool</text>
<text x="44" y="438" font-size="15">partner 模型请求与 tool._run；权限由应用/执行环境提供</text>
<rect x="726" y="65" width="246" height="95" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="742" y="94" font-size="17" font-weight="700">应用提供的持久组件</text>
<text x="742" y="120" font-size="15">checkpointer / store</text>
<text x="742" y="145" font-size="15">构造时注入，可不配置</text>
<path d="M618,105 H720" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="631" y="93" font-size="14">读写 / 绑定</text>
<rect x="726" y="275" width="246" height="95" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="742" y="304" font-size="17" font-weight="700">AgentState / Runtime</text>
<text x="742" y="330" font-size="15">State 经 channel 保存</text>
<text x="742" y="355" font-size="15">context 是本次运行注入</text>
<path d="M618,315 H720" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="631" y="303" font-size="14">读写 / 绑定</text>
<text x="28" y="538" font-size="15">create_agent 是构图工厂，运行调度和 checkpoint 归 LangGraph；框架主干不等于应用依赖。</text>
</g></svg>
