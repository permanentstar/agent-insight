<svg xmlns="http://www.w3.org/2000/svg" width="960" height="880" viewBox="0 0 960 880" role="img" aria-labelledby="title desc">
<title id="title">共同架构：一项工作的运行闭环</title><desc id="desc">用户目标被接纳，运行时选择当前资料与工具定义形成请求，模型决定回答或工具动作；程序执行工具并保存观察与控制变化；下一请求读取新资料，收口还需符合运行和交付条件。</desc>
<rect width="960" height="880" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="#172554">
<text x="30" y="37" font-size="22" fill="#172554" font-weight="700">共同架构：一项工作的运行闭环</text>
<rect x="30" y="72" width="590" height="94" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="100" font-size="18" fill="#172554" font-weight="700">1 接纳目标</text>
<text x="46" y="127" font-size="16" fill="#172554">原输入、会话身份、模式和资源引用</text>
<rect x="30" y="216" width="590" height="100" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="244" font-size="18" fill="#172554" font-weight="700">2 装配请求</text>
<text x="46" y="271" font-size="16" fill="#172554">当前资料投影 + 行为约定 + 工具定义</text>
<text x="46" y="295" font-size="16" fill="#172554">请求形成后，本次输入范围已经确定</text>
<rect x="30" y="372" width="590" height="94" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="400" font-size="18" fill="#172554" font-weight="700">3 模型选择</text>
<text x="46" y="427" font-size="16" fill="#172554">文本回答，或结构化动作请求</text>
<rect x="30" y="521" width="590" height="96" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="549" font-size="18" fill="#172554" font-weight="700">4 执行动作</text>
<text x="46" y="576" font-size="16" fill="#172554">参数受理 / 执行政策 → handler → 观察</text>
<rect x="30" y="674" width="590" height="105" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="702" font-size="18" fill="#172554" font-weight="700">5 更新与判断</text>
<text x="46" y="729" font-size="16" fill="#172554">保存调用和结果，改变相应工作状态</text>
<text x="46" y="753" font-size="16" fill="#172554">继续、等待、接纳新输入或结束</text>
<rect x="700" y="674" width="230" height="105" rx="9" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="716" y="702" font-size="18" fill="#172554" font-weight="700">6 收口</text>
<text x="716" y="729" font-size="16" fill="#172554">运行结束</text>
<text x="716" y="753" font-size="16" fill="#172554">结合验证与交付条件</text>
<path d="M325,166 V212" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M325,316 V368" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M325,466 V517" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M325,617 V670" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M30,726 H13 V266 H26" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M620,727 H696" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M620,421 H666 V755 H624" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="677" y="499" font-size="15" fill="#172554">回答候选</text>
<text x="30" y="828" font-size="17" fill="#172554">资料与状态、执行政策、能力扩展、观察与验收分别作用于相应边界。</text>
<text x="30" y="862" font-size="15" fill="#172554">逻辑职责参考图；不要求每项职责都有独立类、节点或进程。</text>
</g></svg>
