<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">Pi Durable：持久实体与摘要投影</title>
<desc id="desc">ContextView 按 Entry/head 形成模型输入；Document 地址校验 owner 与 scope。
忙会话按 admission 接纳摘要，边界放置或 stale 核销；不会直接跳过前台工作。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker></defs>
<rect width="1000" height="660" fill="#ffffff"/>
<text x="30" y="38" fill="#172554" font-family="Arial, sans-serif" font-size="23" font-weight="700">Pi Durable：持久实体与摘要投影</text>
<polyline points="460,135 540,135" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="500.0" y="122" fill="#334155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">事务</text>
<polyline points="750,190 750,220.0 250,220.0 250,250" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="500" y="213.0" fill="#334155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">采用后</text>
<polyline points="460,305 540,305" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="500.0" y="292" fill="#334155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">发布</text>
<polyline points="40,135 18,135 18,475 40,475" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="26" y="305.0" fill="#334155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">投影</text>
<polyline points="460,475 540,475" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="500.0" y="462" fill="#334155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">候选</text>
<rect x="40" y="80" width="420" height="110" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="58" y="109" fill="#172554" font-family="Arial, sans-serif" font-size="20" font-weight="700">Entry / Task / typed Document</text>
<text x="58" y="136" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">历史贡献、工作状态、可变资料</text>
<text x="58" y="163" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">Session / Conversation / Task scope</text>
<rect x="540" y="80" width="420" height="110" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="558" y="109" fill="#172554" font-family="Arial, sans-serif" font-size="20" font-weight="700">Session commit / Storage</text>
<text x="558" y="136" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">统一准备、持久提交、采用状态</text>
<text x="558" y="163" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">不包含模型或工具外部副作用</text>
<rect x="40" y="250" width="420" height="110" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="58" y="279" fill="#172554" font-family="Arial, sans-serif" font-size="20" font-weight="700">CommittedStateSource</text>
<text x="58" y="306" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">只观察已采用的 Document</text>
<text x="58" y="333" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">句柄 detach 不删除持久数据</text>
<rect x="540" y="250" width="420" height="110" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="558" y="279" fill="#172554" font-family="Arial, sans-serif" font-size="20" font-weight="700">Chord replicatedState</text>
<text x="558" y="306" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">Snapshot + 连续 Update</text>
<text x="558" y="333" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">UI / 远端消费者，不拥有存储</text>
<rect x="40" y="420" width="420" height="110" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="58" y="449" fill="#172554" font-family="Arial, sans-serif" font-size="20" font-weight="700">CompactionTask</text>
<text x="58" y="476" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">select → summarize → retry/commit</text>
<text x="58" y="503" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">摘要模型在事务外执行</text>
<rect x="540" y="420" width="420" height="110" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="558" y="449" fill="#172554" font-family="Arial, sans-serif" font-size="20" font-weight="700">摘要放置边界</text>
<text x="558" y="476" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">generation-owned：当前 commit</text>
<text x="558" y="503" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">conversation-owned：write submission</text>
<text x="30" y="612" fill="#475569" font-family="Arial, sans-serif" font-size="16">ContextView 按 Entry/head 形成模型输入；Document 地址校验 owner 与 scope。</text>
<text x="30" y="635" fill="#475569" font-family="Arial, sans-serif" font-size="16">忙会话按 admission 接纳摘要，边界放置或 stale 核销；不会直接跳过前台工作。</text>
</svg>
