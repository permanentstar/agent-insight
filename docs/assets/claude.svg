<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
<title id="title">Claude：会话、循环、工具与上下文</title><desc id="desc">CLI 分发到 REPL 或 SDK 会话，query async generator 驱动模型工具循环；实际 call 前另做校验和权限。</desc>
<rect width="1000" height="680" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui,sans-serif" fill="#172554">
<text x="28" y="38" font-size="22" font-weight="700">Claude：会话、循环、工具与上下文</text>
<rect x="28" y="75" width="585" height="81" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="105" font-size="18" font-weight="700">入口 · CLI / main</text>
<text x="44" y="132" font-size="15">选择交互 REPL 或非交互 SDK</text>
<rect x="28" y="205" width="585" height="81" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="235" font-size="18" font-weight="700">会话 · REPL / QueryEngine</text>
<text x="44" y="262" font-size="15">messages、AppState、工具池、MCP、权限与事件输出</text>
<rect x="28" y="335" width="585" height="81" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="365" font-size="18" font-weight="700">循环 · query.ts async generator</text>
<text x="44" y="392" font-size="15">准备上下文 → 模型流 → 工具反馈 / stop hooks</text>
<rect x="28" y="465" width="585" height="81" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="495" font-size="18" font-weight="700">效果 · tool executor / canUseTool</text>
<text x="44" y="522" font-size="15">schema、validateInput、权限决定 → 实际 call</text>
<rect x="728" y="205" width="244" height="107" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="744" y="235" font-size="18" font-weight="700">会话资料</text>
<text x="744" y="262" font-size="15">transcript / attachments</text>
<text x="744" y="288" font-size="15">不是活函数栈</text>
<rect x="728" y="465" width="244" height="107" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="744" y="495" font-size="18" font-weight="700">其他控制路径</text>
<text x="744" y="522" font-size="15">stop hook 可续跑</text>
<text x="744" y="548" font-size="15">工具发现不等授权</text>
<path d="M320,156 V200" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M320,286 V330" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M320,416 V460" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M613,245 H723" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="640" y="235" font-size="14">历史</text>
<text x="28" y="625" font-size="15">模型提出动作；会话与运行时分别管理状态、权限和结果。</text>
<text x="28" y="650" font-size="15">QueryEngine 管非交互会话，query.ts 推进循环；两者属于不同层。</text>
</g></svg>
