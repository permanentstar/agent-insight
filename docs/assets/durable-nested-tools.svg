<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
<title id="title">工具嵌套：外层 collect_sources 拥有两个 read</title>
<desc id="desc">模型只请求 collect_sources；它的 execute 用 api.executeTool 依次发起 implementation 与 tests，分别成为子 ToolTask；子结果保存在父任务的 NestedCallDoc，外层汇总结果再进入模型历史。</desc>
<rect width="1000" height="800" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<text x="32" y="40" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#172554">工具嵌套：外层 collect_sources 拥有两个 read</text>
<rect x="40" y="85" width="920" height="85" rx="10" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="58" y="116" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#172554">模型请求 collect_sources</text>
<text x="58" y="146" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#172554">外层创建一个 pi.tool Task；模型等待汇总结果</text>
<rect x="40" y="240" width="920" height="360" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="58" y="271" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#172554">collect_sources.execute：父 ToolTask 的执行范围</text>
<rect x="70" y="310" width="390" height="125" rx="10" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="88" y="341" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#172554">第一个 read 子 ToolTask</text>
<text x="88" y="371" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#172554">key=implementation</text>
<text x="88" y="398" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#172554">读取 src/export.ts</text>
<text x="88" y="425" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#172554">await 完成后才发起下一个</text>
<rect x="540" y="310" width="390" height="125" rx="10" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="558" y="341" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#172554">第二个 read 子 ToolTask</text>
<text x="558" y="371" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#172554">key=tests</text>
<text x="558" y="398" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#172554">读取 test/export.test.ts</text>
<text x="558" y="425" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#172554">每个子任务保留自己的执行结果</text>
<polyline points="460,370 535,370" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="480" y="350" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#172554">顺序</text>
<rect x="70" y="495" width="860" height="75" rx="10" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="88" y="526" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#172554">父任务的 NestedCallDoc：各 key 关联 taskId 与 result</text>
<polyline points="265,435 265,490" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="735,435 735,490" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="500,170 500,235" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="40" y="670" width="920" height="90" rx="10" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="58" y="701" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#172554">外层工具汇总并结束</text>
<text x="58" y="731" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#172554">结果 Entry 交回模型；codemode 也可通过 tools.* 使用同样的子调用机制</text>
<polyline points="500,600 500,665" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)"/>
</svg>
