<svg xmlns="http://www.w3.org/2000/svg" width="930" height="750" viewBox="0 0 930 750" role="img" aria-labelledby="title desc">
<title id="title">Pi Durable：外层反馈与内部工具组合</title><desc id="desc">外层 pi.tool 调 executeTool；子任务结果写父任务文档；codemode 在此基础上重放脚本。</desc>
<rect width="930" height="750" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="#172554">
<text x="30" y="38" font-size="23" fill="#172554">Pi Durable：外层反馈与内部工具组合</text>
<rect x="40" y="85" width="850" height="85" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="56" y="113" font-size="18" fill="#172554">模型选择动作</text>
<text x="56" y="138" font-size="16" fill="#172554">直接工具调用，或 codemode 内的工具程序</text>
<rect x="40" y="230" width="380" height="110" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="56" y="258" font-size="18" fill="#172554">外层 pi.tool Task</text>
<text x="56" y="283" font-size="16" fill="#172554">call → intent → execute</text>
<text x="56" y="308" font-size="16" fill="#172554">模型结果最终写 Entry</text>
<rect x="510" y="230" width="380" height="110" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="526" y="258" font-size="18" fill="#172554">程序中的 executeTool(key)</text>
<text x="526" y="283" font-size="16" fill="#172554">创建独立子 pi.tool</text>
<text x="526" y="308" font-size="16" fill="#172554">同批创建父任务的 NestedCallDoc</text>
<path d="M220 170 V226" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M420 282 H506" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="438" y="265" font-size="15" fill="#172554">调用</text>
<rect x="510" y="415" width="380" height="110" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="526" y="443" font-size="18" fill="#172554">子调用结束</text>
<text x="526" y="468" font-size="16" fill="#172554">结果写 NestedCallDoc.result</text>
<text x="526" y="493" font-size="16" fill="#172554">不自动追加内部 tool-result 历史</text>
<path d="M700 340 V411" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="415" width="380" height="110" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="56" y="443" font-size="18" fill="#172554">外层工具 / codemode 消费结果</text>
<text x="56" y="468" font-size="16" fill="#172554">同 key 重接已有任务与结果</text>
<text x="56" y="493" font-size="16" fill="#172554">收口前清理未完成嵌套工作</text>
<path d="M510 468 H424" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="433" y="451" font-size="15" fill="#172554">返回</text>
<rect x="40" y="610" width="850" height="100" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="56" y="638" font-size="18" fill="#172554">codemode 的脚本重建</text>
<text x="56" y="663" font-size="16" fill="#172554">启动数据 + 交付日志 → 重放相同顺序的结果 → 追上后继续运行</text>
<text x="56" y="688" font-size="16" fill="#172554">外部效果仍由各工具 replay 政策约束；不保存 JS 调用栈。</text>
<path d="M220 525 V606" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
</g></svg>
