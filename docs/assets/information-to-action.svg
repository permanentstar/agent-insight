<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title desc">
<title id="title">信息到动作：语义内容与结构化运行资料</title><desc id="desc">规则、用户目标、外部观察及历史按范围进入模型视图；模型生成文字与调用；程序执行效果，记录观察与运行状态；它们再参与后续请求，历史和当前状态分开。</desc>
<rect width="960" height="820" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="#172554">
<text x="30" y="37" font-size="22" fill="#172554" font-weight="700">信息到动作：语义内容与结构化运行资料</text>
<rect x="30" y="75" width="280" height="115" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="103" font-size="18" fill="#172554" font-weight="700">语义输入</text>
<text x="46" y="130" font-size="16" fill="#172554">规则 / 用户目标</text>
<text x="46" y="154" font-size="16" fill="#172554">资料 / 工具观察 / 记忆</text>
<text x="46" y="178" font-size="16" fill="#172554">保持来源与适用范围</text>
<rect x="370" y="75" width="560" height="115" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="386" y="103" font-size="18" fill="#172554" font-weight="700">历史与当前状态</text>
<text x="386" y="130" font-size="16" fill="#172554">历史：消息、事件、分支与来源</text>
<text x="386" y="154" font-size="16" fill="#172554">状态：清单、活跃工作、checkpoint</text>
<text x="386" y="178" font-size="16" fill="#172554">请求构建器选择当前可见范围</text>
<path d="M310,132 H366" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="270" width="900" height="96" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="298" font-size="18" fill="#172554" font-weight="700">模型请求视图</text>
<text x="46" y="325" font-size="16" fill="#172554">角色、内容块、工具定义、调用关联；预算内的摘要与保留段</text>
<path d="M650,190 V236 H480 V266" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="448" width="430" height="106" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="476" font-size="18" fill="#172554" font-weight="700">模型的语义决定</text>
<text x="46" y="503" font-size="16" fill="#172554">文本：解释、方案或回答</text>
<text x="46" y="527" font-size="16" fill="#172554">tool call：名字、ID、结构化参数</text>
<rect x="530" y="448" width="400" height="106" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="546" y="476" font-size="18" fill="#172554" font-weight="700">程序的执行契约</text>
<text x="546" y="503" font-size="16" fill="#172554">校验与授权 → 效果 → 结果</text>
<text x="546" y="527" font-size="16" fill="#172554">工具调用不是已经执行成功</text>
<path d="M480,366 V407 H245 V444" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M460,499 H526" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="633" width="900" height="108" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="661" font-size="18" fill="#172554" font-weight="700">后续输入与记录</text>
<text x="46" y="688" font-size="16" fill="#172554">结果进入消息／surface；状态按本实现更新；展示与持久确认各有边界</text>
<text x="46" y="712" font-size="16" fill="#172554">模型用新观察再次选择动作，程序管理继续或结束</text>
<path d="M730,554 V629" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M30,687 H12 V319 H26" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="788" font-size="17" fill="#172554">自然语言提供任务意义；schema、ID、状态与提交关系提供可执行接口。</text>
</g></svg>
