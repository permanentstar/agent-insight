<svg xmlns="http://www.w3.org/2000/svg" width="920" height="690" viewBox="0 0 920 690" role="img" aria-labelledby="title desc">
  <title id="title">Pico5：进程内句柄、持久任务与事务外效果</title>
  <desc id="desc">实验应用用 Harness 接纳输入并取得 Submission。Scheduler 按持久 Task record 推进，TaskRuntime 经 Session 事务提交到 Storage。模型与工具执行在事务之外，工具先提交 intent，再执行效果，最后提交 outcome。</desc>
  <rect width="920" height="690" fill="#ffffff"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker></defs>
  <g font-family="system-ui, sans-serif" fill="#172554">
    <text x="30" y="40" font-size="22" font-weight="700">Pico5：进程内句柄、持久任务与事务外效果（实验）</text>
    <rect x="30" y="62" width="860" height="78" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
    <text x="48" y="90" font-size="17" font-weight="700">应用层 · durable TUI / experimental Session Worker</text>
    <text x="48" y="117" font-size="15">Harness.open 组合 Models、Registry、Storage；获取 root Conversation</text>
    <path d="M275,140 V179" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="30" y="182" width="860" height="78" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
    <text x="48" y="210" font-size="17" font-weight="700">接纳层 · Harness / Conversation / Submission</text>
    <text x="48" y="237" font-size="15">submit 接纳输入；Submission 跟踪核销；取消 wait 只停止等待，abort 才控制工作</text>
    <path d="M275,260 V303" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="30" y="306" width="460" height="92" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
    <text x="48" y="334" font-size="17" font-weight="700">推进层 · TaskScheduler / TaskRuntime</text>
    <text x="48" y="360" font-size="15">pi.generation 拥有 pi.tool 子 Task</text>
    <text x="48" y="384" font-size="15">record 持久；当前 invocation 的句柄在进程内</text>
    <path d="M490,350 H637" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="506" y="336" font-size="14">请求 / 执行</text>
    <rect x="640" y="306" width="250" height="160" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
    <text x="658" y="334" font-size="17" font-weight="700">事务外 · 模型 / 工具</text>
    <text x="658" y="362" font-size="15">model stream / execute</text>
    <text x="658" y="388" font-size="15">Session 事务不能回滚效果</text>
    <text x="658" y="414" font-size="15">工具须先保存 intent</text>
    <text x="658" y="440" font-size="15">未知结果由 replay 策略处理</text>
    <path d="M275,398 V439" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="30" y="442" width="460" height="84" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
    <text x="48" y="470" font-size="17" font-weight="700">提交层 · Session / Transaction</text>
    <text x="48" y="496" font-size="15">mutation line：entries/tasks/documents 同批提交</text>
    <text x="48" y="518" font-size="15">提交并采用状态后，才发布对应进度</text>
    <path d="M275,526 V563" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="30" y="566" width="460" height="64" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
    <text x="48" y="593" font-size="17" font-weight="700">持久层 · Storage：Memory / JSONL / SQLite</text>
    <text x="48" y="617" font-size="15">实际耐久性取决于后端和 fsync / WAL 配置</text>
    <text x="30" y="660" font-size="15">工具时间顺序：校验与 beforeTool → 提交 intent → execute → 提交 outcome。</text>
  </g>
</svg>
