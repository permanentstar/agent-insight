<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc">
<title id="title">Claude：请求治理与后台记忆分开</title><desc id="desc">query 先局部结果治理，再请求视图减重，压力仍在时尝试 session memory compact 或完整模型摘要。后台 session extraction 与跨会话 memory 是不同对象。</desc>
<rect width="1000" height="630" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui,sans-serif" fill="#172554">
<text x="28" y="38" font-size="22" font-weight="700">Claude：请求治理与后台记忆分开</text>
<rect x="28" y="75" width="590" height="81" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="105" font-size="18" font-weight="700">本轮 · 局部结果治理</text>
<text x="44" y="132" font-size="15">tool result budget → snip（算法未知）</text>
<rect x="28" y="205" width="590" height="107" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="235" font-size="18" font-weight="700">本轮 · 请求视图</text>
<text x="44" y="262" font-size="15">microcompact → contextCollapse（实现缺失）</text>
<text x="44" y="288" font-size="15">autocompact 判断是否进入正式压缩</text>
<rect x="28" y="365" width="590" height="107" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="395" font-size="18" font-weight="700">本轮 · 正式压缩分支</text>
<text x="44" y="422" font-size="15">先读 session memory；不足则 full compact 调模型</text>
<text x="44" y="448" font-size="15">buildPostCompactMessages 重建 boundary / 附件</text>
<rect x="725" y="75" width="247" height="107" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="741" y="105" font-size="18" font-weight="700">后台 · session</text>
<text x="741" y="132" font-size="15">extraction 生成记忆</text>
<text x="741" y="158" font-size="15">覆盖标记 → compact 读</text>
<rect x="725" y="365" width="247" height="107" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="741" y="395" font-size="18" font-weight="700">跨会话 · memory</text>
<text x="741" y="422" font-size="15">recall：本 turn 使用</text>
<text x="741" y="448" font-size="15">extract / Dream：写与整理</text>
<path d="M322,156 V200" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M322,312 V360" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="342" y="342" font-size="14">压力仍在</text>
<path d="M725,153 H655 V410 H623" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="638" y="327" font-size="14">已有摘要</text>
<text x="28" y="575" font-size="15">本地 messages、请求视图、provider 有效上下文与长期记忆分别判断。</text>
<text x="28" y="600" font-size="15">后台提取、请求压缩与跨会话记忆有不同生命周期。</text>
</g></svg>
