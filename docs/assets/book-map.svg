<svg xmlns="http://www.w3.org/2000/svg" width="920" height="468" viewBox="0 0 920 468" role="img" aria-labelledby="title"><title id="title">分析层次：基线、概念、主链路与边界</title><rect width="920" height="468" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker></defs><g font-family="system-ui, sans-serif" fill="#172554"><text x="30" y="40" font-size="22" font-weight="700">分析层次：基线、概念、主链路与边界</text><rect x="30" y="62" width="860" height="70" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/><text x="48" y="89" font-size="17" font-weight="700">第一层 · 研究对象与基线</text><text x="48" y="115" font-size="15">当前默认 / 当前实验 / 历史冻结；源码 SHA 与核验范围分别记录</text><path d="M460,132 V153" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="156" width="860" height="70" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/><text x="48" y="183" font-size="17" font-weight="700">第二层 · 层次图与概念词典</text><text x="48" y="209" font-size="15">每层职责、所有者、生命周期；项目术语先定义再进入流程</text><path d="M460,226 V247" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="250" width="860" height="70" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/><text x="48" y="277" font-size="17" font-weight="700">第三层 · 一次输入的执行链</text><text x="48" y="303" font-size="15">构造与注入 → 调度 → 模型/工具执行 → 状态提交 → 展示</text><path d="M460,320 V341" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="344" width="860" height="70" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/><text x="48" y="371" font-size="17" font-weight="700">第四层 · 边界与横向取舍</text><text x="48" y="397" font-size="15">取消、崩溃、恢复、权限、并发；同一问题与同一证据等级比较</text></g></svg>
