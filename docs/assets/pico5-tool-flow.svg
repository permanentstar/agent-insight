<svg xmlns="http://www.w3.org/2000/svg" width="960" height="750" viewBox="0 0 960 750" role="img" aria-labelledby="title desc">
<title id="title">Pi Durable 工具：正常执行与恢复入口</title><desc id="desc">工具先确定允许执行的最终动作，再保存动作参数与重跑约定，让中断恢复有依据。随后事务外调用文件或服务，结束时把观察交给下一生成并确认任务完成。恢复时只有保存与当前定义都允许重跑才再次调用；已发生的外部效果不随会话事务撤销。</desc>
<rect width="960" height="750" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="#172554">
<text x="30" y="37" font-size="22" fill="#172554" font-weight="700">Pi Durable 工具：正常执行与恢复入口</text>
<rect x="30" y="75" width="590" height="92" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="103" font-size="18" fill="#172554" font-weight="700">确定本次允许执行的动作（call）</text>
<text x="46" y="130" font-size="16" fill="#172554">找定义并确定最终参数，让实际调用经过校验（beforeTool）</text>
<rect x="30" y="222" width="590" height="94" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="250" font-size="18" fill="#172554" font-weight="700">先记住将执行的动作，供中断恢复判断</text>
<text x="46" y="277" font-size="16" fill="#172554">保存最终参数与重跑约定（execute checkpoint / arguments / replay）</text>
<rect x="30" y="373" width="590" height="92" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="401" font-size="18" fill="#172554" font-weight="700">实际读写文件或调用服务（事务外）</text>
<text x="46" y="428" font-size="16" fill="#172554">持续输出交界面观察（tool.execute；进度另行 commit）</text>
<rect x="30" y="525" width="590" height="110" rx="9" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="46" y="553" font-size="18" fill="#172554" font-weight="700">留下工具观察，确认动作已结束</text>
<text x="46" y="580" font-size="16" fill="#172554">结果供后续生成采用，界面切到最终结果（tool-result / live）</text>
<text x="46" y="604" font-size="16" fill="#172554">同时保存任务完成回执（Task outcome）</text>
<path d="M325,167 V218" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M325,316 V369" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M325,465 V521" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="675" y="222" width="255" height="142" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="691" y="250" font-size="18" fill="#172554" font-weight="700">先判断动作可否重做</text>
<text x="691" y="277" font-size="16" fill="#172554">保存时允许（replay=safe）</text>
<text x="691" y="301" font-size="16" fill="#172554">当前定义也允许（safe）</text>
<text x="691" y="325" font-size="16" fill="#172554">两者均允许才重新调用</text>
<path d="M675,315 H650 V419 H624" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="689" font-size="17" fill="#172554">正常调用在保存意图后直接执行；中断重开才由 execute 阶段检查如何恢复。</text>
<text x="30" y="727" font-size="16" fill="#172554">事务保存本系统记录；外部效果不会随 Session 回滚。</text>
</g></svg>
