<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="565" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Hermes：宿主会话、Agent 与 provider/tool 边界</title>
<desc id="desc">入口 · CLI / Gateway / ACP：宿主加载配置、历史并决定是否复用 AIAgent；产品编排 · AIAgent.run_conversation：建立 turn；组织压缩、重试、模型及工具阶段；模型阶段 · API request / ProviderTransport：协议转换与响应规范化；特定模式可移交 Codex app-server；工具阶段 · executor → model_tools → registry：分段串并行；实际 handler 与 hook 决定外部效果；宿主接入、Agent 实例与 DB 会话是不同生命周期；中断不能撤销已发生的工具效果。</desc>
<rect width="1000" height="565" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui,sans-serif" fill="#172554">
<text x="28" y="37" font-size="22" font-weight="700">Hermes：宿主会话、Agent 与 provider/tool 边界</text>
<rect x="28" y="65" width="590" height="80" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="93" font-size="18" font-weight="700">入口 · CLI / Gateway / ACP</text>
<text x="44" y="123" font-size="15">宿主加载配置、历史并决定是否复用 AIAgent</text>
<path d="M310,145 V166" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="170" width="590" height="80" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="198" font-size="18" font-weight="700">产品编排 · AIAgent.run_conversation</text>
<text x="44" y="228" font-size="15">建立 turn；组织压缩、重试、模型及工具阶段</text>
<path d="M310,250 V271" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="275" width="590" height="80" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="303" font-size="18" font-weight="700">模型阶段 · API request / ProviderTransport</text>
<text x="44" y="333" font-size="15">协议转换与响应规范化；特定模式可移交 Codex app-server</text>
<path d="M310,355 V376" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="380" width="590" height="80" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="408" font-size="18" font-weight="700">工具阶段 · executor → model_tools → registry</text>
<text x="44" y="438" font-size="15">分段串并行；实际 handler 与 hook 决定外部效果</text>
<rect x="726" y="170" width="246" height="95" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="742" y="199" font-size="17" font-weight="700">SessionDB</text>
<text x="742" y="225" font-size="15">消息批次事务 / 会话关系</text>
<text x="742" y="250" font-size="15">展示历史与模型历史有差别</text>
<path d="M618,210 H720" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="631" y="198" font-size="14">读写 / 绑定</text>
<rect x="726" y="275" width="246" height="95" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="742" y="304" font-size="17" font-weight="700">context / memory</text>
<text x="742" y="330" font-size="15">压缩控制当前请求大小</text>
<text x="742" y="355" font-size="15">长期记忆与当前历史分开</text>
<path d="M618,315 H720" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="631" y="303" font-size="14">读写 / 绑定</text>
<text x="28" y="538" font-size="15">宿主接入、Agent 实例与 DB 会话是不同生命周期；中断不能撤销已发生的工具效果。</text>
</g></svg>
