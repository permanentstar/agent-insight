<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">Pi Durable：同一事务 Session 内的记录关系</title>
  <desc id="desc">箭头标出归属或引用；SQLite 使用 JSON record 加查询列，未为这些引用声明 SQL 外键。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="680" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif" fill="#0f172a">
    <text x="35" y="38" font-size="24" font-weight="700">Pi Durable：同一事务 Session 内的记录关系</text>
    <text x="35" y="68" font-size="16">箭头标出归属或引用；SQLite 使用 JSON record 加查询列，未为这些引用声明 SQL 外键。</text>
    <path d="M560 160V215" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="572.0" y="173" width="56" height="23" fill="#ffffff"/>
    <text x="600" y="190" font-size="15" text-anchor="middle">1 : N</text>
    <path d="M560 305V365" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="572.0" y="323" width="56" height="23" fill="#ffffff"/>
    <text x="600" y="340" font-size="15" text-anchor="middle">1 : N</text>
    <path d="M420 260H185V365" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="262.0" y="233" width="56" height="23" fill="#ffffff"/>
    <text x="290" y="250" font-size="15" text-anchor="middle">1 : N</text>
    <path d="M700 260H925V365" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="792.0" y="233" width="56" height="23" fill="#ffffff"/>
    <text x="820" y="250" font-size="15" text-anchor="middle">1 : N</text>
    <path d="M785 415H700" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="704.0" y="385" width="80" height="23" fill="#ffffff"/>
    <text x="744" y="402" font-size="15" text-anchor="middle">byTaskId</text>
    <path d="M185 465V498H925V465" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="491.0" y="476" width="128" height="23" fill="#ffffff"/>
    <text x="555" y="493" font-size="15" text-anchor="middle">entry / answer</text>
    <path d="M335 585H420" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="349.0" y="557" width="56" height="23" fill="#ffffff"/>
    <text x="377" y="574" font-size="15" text-anchor="middle">1 : N</text>
    <rect x="420" y="90" width="280" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="435" y="119" font-size="19" font-weight="650">Session / Storage</text>
    <text x="435" y="146" font-size="16">事务与提交 seq 的边界</text>
    <rect x="420" y="215" width="280" height="90" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="435" y="244" font-size="19" font-weight="650">Conversation</text>
    <text x="435" y="271" font-size="16">id；parent 与 owner 分开</text>
    <text x="435" y="295" font-size="16">一段会话内有多份工作与历史</text>
    <rect x="35" y="365" width="300" height="100" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="50" y="394" font-size="19" font-weight="650">Submission</text>
    <text x="50" y="421" font-size="16">id / conversationId / status</text>
    <text x="50" y="445" font-size="16">entry、answer → Entry.id</text>
    <rect x="420" y="365" width="280" height="100" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="435" y="394" font-size="19" font-weight="650">Task</text>
    <text x="435" y="421" font-size="16">id / conversationId / state</text>
    <text x="435" y="445" font-size="16">owner → Task；on → Task</text>
    <rect x="785" y="365" width="280" height="100" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="800" y="394" font-size="19" font-weight="650">Entry</text>
    <text x="800" y="421" font-size="16">id / conversationId / byTaskId</text>
    <text x="800" y="445" font-size="16">model / data / head / edits</text>
    <rect x="35" y="535" width="300" height="100" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="50" y="564" font-size="19" font-weight="650">Document</text>
    <text x="50" y="591" font-size="16">id / kind / scope / key</text>
    <text x="50" y="615" font-size="16">scope 指定所属记录或 Session</text>
    <rect x="420" y="535" width="280" height="100" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="435" y="564" font-size="19" font-weight="650">document_revisions</text>
    <text x="435" y="591" font-size="16">document_id / seq / version</text>
    <text x="435" y="615" font-size="16">base 或 delta；按策略保留</text>
    <rect x="785" y="535" width="280" height="100" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="800" y="564" font-size="19" font-weight="650">不同消费者</text>
    <text x="800" y="591" font-size="16">Task → scheduler</text>
    <text x="800" y="615" font-size="16">Entry → 模型；Document → 视图</text>
  </g>
</svg>
