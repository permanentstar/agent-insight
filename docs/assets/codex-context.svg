<text x="58" y="136" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">config、模型、environment</text>
<text x="58" y="163" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">StepContext 固定调用能力</text>
