<text x="558" y="109" fill="#172554" font-family="Arial, sans-serif" font-size="20" font-weight="700">规则与 MCP / Skills</text>
<text x="558" y="136" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">trust + 根到 cwd 规则加载</text>
<text x="558" y="163" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">runtime_config_for_step / invocation</text>
