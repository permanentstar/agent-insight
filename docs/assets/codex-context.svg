<text x="58" y="503" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">继承环境，启动后发布子线程</text>
<rect x="540" y="420" width="420" height="110" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="558" y="449" fill="#172554" font-family="Arial, sans-serif" font-size="20" font-weight="700">Rollout / 事件输出</text>
<text x="558" y="476" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">记录排队与 flush 确认分开</text>
<text x="558" y="503" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">fork/resume 重建事实，不恢复函数栈</text>
<text x="30" y="612" fill="#475569" font-family="Arial, sans-serif" font-size="16">AGENTS 文本约束模型，文件系统和命令权限在实际工具/环境边界生效。</text>
<text x="30" y="635" fill="#475569" font-family="Arial, sans-serif" font-size="16">V1/V2 与 SessionSource 的分支不同；线程分支不等同 Git branch 或 worktree。</text>
