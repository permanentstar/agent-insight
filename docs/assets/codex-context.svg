<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">Codex：step 快照、上下文与子线程</title>
<desc id="desc">AGENTS 文本约束模型，文件系统和命令权限在实际工具/环境边界生效。
V1/V2 与 SessionSource 的分支不同；线程分支不等同 Git branch 或 worktree。</desc>
