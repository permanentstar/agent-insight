<text x="500" y="213.0" fill="#334155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">压缩</text>
<polyline points="40,135 18,135 18,475 40,475" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="26" y="305.0" fill="#334155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">委派</text>
<polyline points="750,360 750,420" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="758" y="390.0" fill="#334155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">记录</text>
<polyline points="460,475 540,475" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="500.0" y="462" fill="#334155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">归属</text>
