<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">计划怎样推进，与工作交给谁，是两个选择</title>
<desc id="desc">Plan &amp; Execute 可使用单个 Executor 或多个 worker；反馈循环可临时委派子任务。计划提供步骤消费关系，执行者数量与依赖决定协作形态。</desc>
<rect width="1000" height="660" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<text x="32" y="40" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#172554">计划怎样推进，与工作交给谁，是两个选择</text>
<rect x="40" y="85" width="920" height="100" rx="10" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="58" y="116" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#172554">Plan &amp; Execute：显式计划选择下一步骤，结果回到计划更新</text>
<text x="58" y="146" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#172554">目标 → plan → 选 step → Executor 返回结果 → 继续／replan／结束</text>
<rect x="40" y="255" width="420" height="150" rx="10" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="58" y="286" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#172554">选择一：单个 Executor</text>
<text x="58" y="316" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#172554">按 inspect、change、verify 逐项接收</text>
<text x="58" y="343" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#172554">每项内部可多轮模型与工具交互</text>
<text x="58" y="370" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#172554">计划消费与重规划链路完整</text>
<rect x="540" y="255" width="420" height="150" rx="10" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="558" y="286" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#172554">选择二：多个 worker</text>
<text x="558" y="316" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#172554">外层按步骤和能力分派工作</text>
<text x="558" y="343" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#172554">独立读取可以并行，修改后再验证</text>
<text x="558" y="370" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#172554">结果仍回到外层计划</text>
<polyline points="250,185 250,250" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="750,185 750,250" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="40" y="485" width="920" height="120" rx="10" fill="#fff7ed" stroke="#475569" stroke-width="2"/>
<text x="58" y="516" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#172554">反馈循环也可以临时委派</text>
<text x="58" y="546" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#172554">主 Agent 读取代码 → 委派子 Agent 检查换行覆盖 → 采用子结果 → 决定下一动作</text>
<text x="58" y="573" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#172554">若外层另有步骤清单并据此派发，就同时具备上面的计划执行关系。</text>
</svg>
