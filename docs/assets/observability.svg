<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img">
<title>模型执行与观察树：两条链在调用处相交</title>
<rect width="960" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs>
<text x="32" y="40" font-family="sans-serif" font-size="24" font-weight="700" fill="#172554">模型执行与观察树：两条链在调用处相交</text>
<rect x="32" y="65" width="896" height="110" rx="12" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="54" y="94" font-family="sans-serif" font-size="21" font-weight="700" fill="#172554">根调用上下文</text>
<text x="54" y="124" font-family="sans-serif" font-size="19" fill="#172554">RunnableConfig：callbacks / tags / metadata</text>
<text x="54" y="154" font-family="sans-serif" font-size="17" fill="#334155">子调用派生 callback manager，传递 parent_run_id</text>
<path d="M480 177V195" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="197" width="896" height="110" rx="12" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="54" y="226" font-family="sans-serif" font-size="21" font-weight="700" fill="#172554">观察树</text>
<text x="54" y="256" font-family="sans-serif" font-size="19" fill="#172554">Tracer：run_map / order_map → trace_id / dotted_order</text>
<text x="54" y="286" font-family="sans-serif" font-size="17" fill="#334155">end 或 error 记录结果；缺失父项可成为新根</text>
<path d="M480 309V327" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="329" width="896" height="110" rx="12" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="54" y="358" font-family="sans-serif" font-size="21" font-weight="700" fill="#172554">模型执行</text>
<text x="54" y="388" font-family="sans-serif" font-size="19" fill="#172554">BaseChatModel → Partner → SDK → ChatResult / Chunk</text>
<text x="54" y="418" font-family="sans-serif" font-size="17" fill="#334155">trace 是观察数据；checkpoint 和业务 effect 另有 owner</text>
<text x="32" y="478" font-family="sans-serif" font-size="16" fill="#334155">固定源码基线的静态分析；没有运行模型、索引服务或 tracing 后端。</text>
</svg>
