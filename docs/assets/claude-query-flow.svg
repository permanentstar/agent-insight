<svg xmlns="http://www.w3.org/2000/svg" width="960" height="805" viewBox="0 0 960 805" role="img" aria-labelledby="title desc">
<title id="title">Claude query：历史研究中的循环</title><desc id="desc">会话将输入交 query，构建 messagesForQuery 并检查预算；模型工具调用经校验与权限后执行、回填工具结果，再请求模型；无工具时 Stop hooks 可继续或结束。</desc>
<rect width="960" height="805" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="#172554">
<text x="30" y="37" font-size="22" fill="#172554" font-weight="700">Claude query：历史研究中的循环</text>
<rect x="30" y="75" width="590" height="94" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="103" font-size="18" fill="#172554" font-weight="700">会话入口 → query</text>
<text x="46" y="130" font-size="16" fill="#172554">输入 / 附件 / 命令分流</text>
<text x="46" y="154" font-size="16" fill="#172554">messagesForQuery 与上下文预算处理</text>
<rect x="30" y="224" width="590" height="94" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="252" font-size="18" fill="#172554" font-weight="700">模型流</text>
<text x="46" y="279" font-size="16" fill="#172554">assistant 文本与 tool_use 内容块</text>
<rect x="30" y="382" width="590" height="124" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="410" font-size="18" fill="#172554" font-weight="700">工具执行</text>
<text x="46" y="437" font-size="16" fill="#172554">schema / validateInput → canUseTool → call</text>
<text x="46" y="461" font-size="16" fill="#172554">tool_result 用 tool_use_id 对应调用</text>
<text x="46" y="485" font-size="16" fill="#172554">结果加入下一轮消息</text>
<rect x="695" y="382" width="235" height="124" rx="9" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="711" y="410" font-size="18" fill="#172554" font-weight="700">Stop hooks</text>
<text x="711" y="437" font-size="16" fill="#172554">无工具时检查</text>
<text x="711" y="461" font-size="16" fill="#172554">继续则追加信息</text>
<text x="711" y="485" font-size="16" fill="#172554">通过则结束</text>
<path d="M325,169 V220" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M325,318 V378" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M30,445 H13 V271 H26" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M620,271 H813 V378" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M813,382 V125 H624" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="605" width="900" height="116" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="633" font-size="18" fill="#172554" font-weight="700">会话消费 query 产出</text>
<text x="46" y="660" font-size="16" fill="#172554">async generator 逐次 yield 流、assistant、结果与压缩边界</text>
<text x="46" y="684" font-size="16" fill="#172554">UI 显示、请求资料与 transcript 生命周期不同</text>
<path d="M813,506 V601" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="772" font-size="15" fill="#172554">图展示历史材料所述控制关系，不将这些阶段声明为源码的持久状态枚举。</text>
</g></svg>
