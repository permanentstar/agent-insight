<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">恢复比较：先确定恢复的对象</title><desc id="desc">历史用于重建模型视图，工作记录用于决定任务或图的后续推进，外部效果不能由前两者的事务自动保证恰好一次。</desc>
<rect width="1000" height="430" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui,sans-serif" fill="#172554">
<text x="28" y="38" font-size="22" font-weight="700">恢复比较：先确定恢复的对象</text>
<rect x="28" y="80" width="944" height="81" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="110" font-size="18" font-weight="700">共同故障：外部写入已发生，结果尚未耐久</text>
<text x="44" y="137" font-size="15">重启后既要重建上下文，也要判断原工作和外部结果；观察到文本不是耐久证明</text>
<rect x="28" y="230" width="286" height="107" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="44" y="260" font-size="18" font-weight="700">历史 / 请求视图</text>
<text x="44" y="287" font-size="15">消息、事件树、surface、摘要</text>
<text x="44" y="313" font-size="15">回答：模型接着看什么</text>
<rect x="358" y="230" width="286" height="107" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="374" y="260" font-size="18" font-weight="700">工作 / 控制状态</text>
<text x="374" y="287" font-size="15">Task 或 graph checkpoint</text>
<text x="374" y="313" font-size="15">回答：从哪步继续或关闭</text>
<rect x="688" y="230" width="284" height="107" rx="8" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="704" y="260" font-size="18" font-weight="700">外部效果</text>
<text x="704" y="287" font-size="15">文件、进程、远端系统</text>
<text x="704" y="313" font-size="15">回答：到底做成了没有</text>
<path d="M180,162 V225" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M500,162 V225" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M830,162 V225" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="28" y="375" font-size="15">各层可存在不同提交边界；历史不能替代工作记录，工作事务也不覆盖外部系统。</text>
<text x="28" y="400" font-size="15">效果结果未知时，需要明确重放政策、外部幂等键或核对接口。</text>
</g></svg>
