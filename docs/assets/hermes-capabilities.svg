<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">Hermes：ACP 输入、工具与后台工作</title>
<desc id="desc">同会话 turn 排队不等于跨会话串行；工具发现、知识索引与审批不是一个层次。
仅有明确隔离的外部后台 worker 才按其契约延续；不能推及所有内存任务。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker></defs>
<rect width="1000" height="660" fill="#ffffff"/>
<text x="30" y="38" fill="#172554" font-family="Arial, sans-serif" font-size="23" font-weight="700">Hermes：ACP 输入、工具与后台工作</text>
<polyline points="460,135 540,135" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="500.0" y="122" fill="#334155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">输入</text>
<polyline points="750,190 750,220.0 250,220.0 250,250" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="500" y="213.0" fill="#334155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">调用</text>
<polyline points="750,190 750,250" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="758" y="220.0" fill="#334155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">委派</text>
<polyline points="250,360 250,390.0 750,390.0 750,420" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="500" y="383.0" fill="#334155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">结果</text>
<polyline points="750,360 750,420" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="758" y="390.0" fill="#334155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">结果</text>
<polyline points="460,475 540,475" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="500.0" y="462" fill="#334155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">投递</text>
<rect x="40" y="80" width="420" height="110" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="58" y="109" fill="#172554" font-family="Arial, sans-serif" font-size="20" font-weight="700">ACP / 平台宿主</text>
<text x="58" y="136" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">extract input → slash command</text>
<text x="58" y="163" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">claim turn 或同会话排队</text>
<rect x="540" y="80" width="420" height="110" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="558" y="109" fill="#172554" font-family="Arial, sans-serif" font-size="20" font-weight="700">AIAgent 对话</text>
<text x="558" y="136" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">宿主接入回调与 executor context</text>
<text x="558" y="163" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">run_conversation / finish turn</text>
<rect x="40" y="250" width="420" height="110" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="58" y="279" fill="#172554" font-family="Arial, sans-serif" font-size="20" font-weight="700">工具与知识装配</text>
<text x="58" y="306" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">registry / toolsets / skill 索引</text>
<text x="58" y="333" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">schema 选择与权限分开</text>
<rect x="540" y="250" width="420" height="110" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="558" y="279" fill="#172554" font-family="Arial, sans-serif" font-size="20" font-weight="700">delegate child</text>
<text x="558" y="306" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">独立 AIAgent / 有限深度</text>
<text x="558" y="333" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">completed / interrupted / failed</text>
<rect x="40" y="420" width="420" height="110" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="58" y="449" fill="#172554" font-family="Arial, sans-serif" font-size="20" font-weight="700">cron claim 与投递</text>
<text x="58" y="476" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">scheduler 构造 Agent</text>
<text x="58" y="503" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">side_effect_fence 校验 owner</text>
<rect x="540" y="420" width="420" height="110" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="558" y="449" fill="#172554" font-family="Arial, sans-serif" font-size="20" font-weight="700">持久化 / 平台反馈</text>
<text x="558" y="476" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">SessionDB 批次成功后置 marker</text>
<text x="558" y="503" fill="#172554" font-family="Arial, sans-serif" font-size="18" font-weight="400">平台 chunk / delivery 另有边界</text>
<text x="30" y="612" fill="#475569" font-family="Arial, sans-serif" font-size="16">同会话 turn 排队不等于跨会话串行；工具发现、知识索引与审批不是一个层次。</text>
<text x="30" y="635" fill="#475569" font-family="Arial, sans-serif" font-size="16">仅有明确隔离的外部后台 worker 才按其契约延续；不能推及所有内存任务。</text>
</svg>
