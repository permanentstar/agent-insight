<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1040" viewBox="0 0 1060 1040" role="img" aria-labelledby="title desc">
<title id="title">Pi Durable Generation：正常反馈与持久等待</title>
<desc id="desc">先固定请求依据，再取得模型判断。需要动作就等待工具观察，再把同一输入交给新生成；直接回答则确认完成。请求失败可保存下次尝试时点并释放执行占用，到期重新准备；服务端已有工作则记住取回凭据，到期查询其结果后再分类。</desc>
<rect width="1060" height="1040" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="#172554">
<text x="30" y="38" font-size="23" fill="#172554">Pi Durable Generation：正常反馈与持久等待</text>
<rect x="40" y="90" width="510" height="100" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="56" y="118" font-size="18" fill="#172554">固定本次请求依据（prepare）</text>
<text x="56" y="143" font-size="16" fill="#172554">准备提示与工具，记住配置及历史范围（cutoff）</text>
<rect x="40" y="250" width="510" height="90" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="56" y="278" font-size="18" fill="#172554">取得模型判断（request）</text>
<text x="56" y="303" font-size="16" fill="#172554">读取约定范围，向模型提问；等待响应在事务外</text>
<rect x="40" y="420" width="510" height="90" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="56" y="448" font-size="18" fill="#172554">判断接下来该做什么（classify）</text>
<text x="56" y="473" font-size="16" fill="#172554">回答、执行工具，或等待下一次尝试／服务端结果</text>
<rect x="40" y="600" width="510" height="100" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="56" y="628" font-size="18" fill="#172554">先取得工具观察再继续（tools）</text>
<text x="56" y="653" font-size="16" fill="#172554">等工具给出结果，再处理本轮观察（waiting）</text>
<rect x="40" y="790" width="510" height="100" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="56" y="818" font-size="18" fill="#172554">把同一输入交给下一轮判断</text>
<text x="56" y="843" font-size="16" fill="#172554">新生成接手运行归属（successor / live.run.taskId）</text>
<rect x="700" y="90" width="310" height="120" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="716" y="118" font-size="18" fill="#172554">等一段时间再尝试</text>
<text x="716" y="143" font-size="16" fill="#172554">记住下次时点，释放执行占用</text>
<text x="716" y="168" font-size="16" fill="#172554">到期重新准备（retry / sleeping）</text>
<rect x="700" y="275" width="310" height="120" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="716" y="303" font-size="18" fill="#172554">等待服务端已有工作的结果</text>
<text x="716" y="328" font-size="16" fill="#172554">记住取回凭据与下次查询时点</text>
<text x="716" y="353" font-size="16" fill="#172554">到期查询（poll / handle）</text>
<rect x="700" y="600" width="310" height="100" rx="9" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="716" y="628" font-size="18" fill="#172554">回答与完成回执一起生效</text>
<text x="716" y="653" font-size="16" fill="#172554">保存回答，再处理边界后续工作</text>
<text x="716" y="678" font-size="16" fill="#172554">无需继续时收口输入（endRun）</text>
<path d="M295 190 V246" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M295 340 V416" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M295 510 V596" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="315" y="558" font-size="16" fill="#172554">请求工具</text>
<path d="M295 700 V786" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M550 840 H610 V140 H554" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="568" y="757" font-size="15" fill="#172554">新一轮</text>
<path d="M550 470 H850 V596" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="865" y="549" font-size="15" fill="#172554">回答</text>
<path d="M550 440 H650 V155 H696" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="655" y="250" font-size="15" fill="#172554">重试</text>
<path d="M700 120 H554" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="575" y="101" font-size="14" fill="#172554">到期再准备</text>
<path d="M700 365 H675 V487 H554" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="704" y="420" font-size="14" fill="#172554">取得结果后再判断</text>
<path d="M1010 470 H1030 V335 H1014" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="867" y="455" font-size="14" fill="#172554">服务端继续处理</text>
<path d="M850 470 H1010" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="956" font-size="17" fill="#172554">重试要重新准备并发起请求；延后查询继续取同一份服务端工作（retry / poll）。</text>
<text x="40" y="995" font-size="16" fill="#172554">图示正常反馈；prepare 还可能等待阻塞压缩，任务可失败或取消。</text>
</g></svg>
