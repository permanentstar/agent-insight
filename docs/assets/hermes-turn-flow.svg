<svg xmlns="http://www.w3.org/2000/svg" width="960" height="875" viewBox="0 0 960 875" role="img" aria-labelledby="title desc">
<title id="title">Hermes 原生：宿主复用，逐轮组装请求</title><desc id="desc">宿主获取 AIAgent，一次用户 turn 初始化消息与局部循环状态；每轮准备与 preflight 后调用 transport，再执行工具或结束；可选 Codex app-server 接管整轮属于旁路。</desc>
<rect width="960" height="875" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="#172554">
<text x="30" y="37" font-size="22" fill="#172554" font-weight="700">Hermes 原生：宿主复用，逐轮组装请求</text>
<rect x="30" y="75" width="590" height="100" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="103" font-size="18" fill="#172554" font-weight="700">宿主 → AIAgent.run_conversation</text>
<text x="46" y="130" font-size="16" fill="#172554">CLI/Gateway/ACP 绑定输入、历史和回调</text>
<text x="46" y="154" font-size="16" fill="#172554">build_turn_context → 本轮 _LoopState</text>
<rect x="30" y="225" width="590" height="102" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="253" font-size="18" fill="#172554" font-weight="700">一次 iteration 的请求准备</text>
<text x="46" y="280" font-size="16" fill="#172554">begin → prepare → assemble → preflight</text>
<text x="46" y="304" font-size="16" fill="#172554">前置检查可返回、结束或跳到下次 iteration</text>
<rect x="30" y="385" width="590" height="94" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="413" font-size="18" fill="#172554" font-weight="700">模型协议边界</text>
<text x="46" y="440" font-size="16" fill="#172554">retry loop → ProviderTransport → normalize</text>
<text x="46" y="464" font-size="16" fill="#172554">得到统一 assistant_message</text>
<rect x="30" y="538" width="590" height="104" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="566" font-size="18" fill="#172554" font-weight="700">有 tool_calls：工具轮次</text>
<text x="46" y="593" font-size="16" fill="#172554">调度 → handler → 结果写回消息</text>
<text x="46" y="617" font-size="16" fill="#172554">继续下一 iteration</text>
<rect x="695" y="385" width="235" height="110" rx="9" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="711" y="413" font-size="18" fill="#172554" font-weight="700">无工具：文本收口</text>
<text x="711" y="440" font-size="16" fill="#172554">finish_text_response</text>
<text x="711" y="464" font-size="16" fill="#172554">结束条件成立</text>
<rect x="695" y="75" width="235" height="100" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="711" y="103" font-size="18" fill="#172554" font-weight="700">可选整轮旁路</text>
<text x="711" y="130" font-size="16" fill="#172554">codex_app_server</text>
<text x="711" y="154" font-size="16" fill="#172554">交给子进程运行</text>
<path d="M325,175 V221" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M325,327 V381" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M325,479 V534" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M30,590 H13 V277 H26" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M620,432 H691" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M620,124 H691" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="735" width="900" height="98" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="763" font-size="18" fill="#172554" font-weight="700">turn 收口与宿主保存</text>
<text x="46" y="790" font-size="16" fill="#172554">finalize / export_current_turn_boundary</text>
<text x="46" y="814" font-size="16" fill="#172554">请求内容、展示内容、SessionDB 和长期记忆分别管理</text>
<path d="M810,495 V731" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="862" font-size="15" fill="#172554">流程阶段用于教学；api_call_count、预算与控制动作是实际循环条件。</text>
</g></svg>
