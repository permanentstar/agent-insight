<svg xmlns="http://www.w3.org/2000/svg" width="920" height="810" viewBox="0 0 920 810" role="img" aria-labelledby="title desc">
<title id="title">codemode：每一次嵌套调用都跨回宿主</title><desc id="desc">脚本 tools 调用经过 sandboxTools、ctx.executeTool、NestedToolCallRunner 回到共享 runToolCall 的校验、hook 和真实 execute。结果变为脚本值；只有脚本成功才提交 store 差异。</desc>
<rect width="920" height="810" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="#172554">
<text x="30" y="36" font-size="23" fill="#172554" text-anchor="start" font-weight="700">codemode：每一次嵌套调用都跨回宿主</text>
<rect x="30" y="65" width="560" height="94" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="93" font-size="18" fill="#172554" text-anchor="start" font-weight="700">脚本环境：QuickJS 中的 tools.xxx(args)</text>
<text x="46" y="119" font-size="18" fill="#172554" text-anchor="start">没有 Node、文件系统或直接网络 API</text>
<text x="46" y="145" font-size="18" fill="#172554" text-anchor="start">它只能请求宿主提供的工具包装</text>
<rect x="30" y="207" width="560" height="94" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="235" font-size="18" fill="#172554" text-anchor="start" font-weight="700">脚本宿主：sandboxTools 的 execute</text>
<text x="46" y="261" font-size="18" fill="#172554" text-anchor="start">await ctx.executeTool(name, args, options)</text>
<text x="46" y="287" font-size="18" fill="#172554" text-anchor="start">得到的是一个嵌套工具调用结果</text>
<rect x="30" y="349" width="560" height="94" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="377" font-size="18" fill="#172554" text-anchor="start" font-weight="700">会话层：NestedToolCallRunner</text>
<text x="46" y="403" font-size="18" fill="#172554" text-anchor="start">按当前可调用集合分派，保留父调用身份</text>
<text x="46" y="429" font-size="18" fill="#172554" text-anchor="start">调用 AgentSession 的 runToolCall 适配</text>
<rect x="30" y="491" width="560" height="110" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="519" font-size="18" fill="#172554" text-anchor="start" font-weight="700">共享工具管线：runToolCall</text>
<text x="46" y="545" font-size="18" fill="#172554" text-anchor="start">准备 / 校验 / hook；immediate 直接返回</text>
<text x="46" y="571" font-size="18" fill="#172554" text-anchor="start">prepared：execute → after hook → outcome</text>
<rect x="665" y="491" width="225" height="110" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="681" y="519" font-size="18" fill="#172554" text-anchor="start" font-weight="700">toScriptValue</text>
<text x="681" y="545" font-size="18" fill="#172554" text-anchor="start">structuredContent</text>
<text x="681" y="571" font-size="18" fill="#172554" text-anchor="start">或文本 / 抛出错误</text>
<rect x="665" y="207" width="225" height="94" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="681" y="235" font-size="18" fill="#172554" text-anchor="start" font-weight="700">回到脚本</text>
<text x="681" y="261" font-size="18" fill="#172554" text-anchor="start">返回值供下一步决策</text>
<text x="681" y="287" font-size="18" fill="#172554" text-anchor="start">已发生的效果不回滚</text>
<rect x="30" y="661" width="860" height="84" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="689" font-size="18" fill="#172554" text-anchor="start" font-weight="700">脚本结束：只有 result.ok 才追加 storeWrites</text>
<text x="46" y="715" font-size="18" fill="#172554" text-anchor="start">脚本失败不提交这份 store 变化，但不会回滚之前的工具效果</text>
<path d="M310,159 V203" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M310,301 V345" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M310,443 V487" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M590,545 H661" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M778,491 V305" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M310,601 V657" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="787" font-size="17" fill="#172554" text-anchor="start">脚本组合动作，产品与工具层决定可调用能力和真实效果。</text>
</g></svg>
