<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
<title id="title">LangChain：消息累积驱动模型与工具图</title><desc id="desc">用户输入进入 AgentState.messages；模型返回工具调用，经条件路由进入工具节点；ToolMessage 按调用 ID 回填，再请求模型；最终响应进入结束路由。</desc>
<rect width="960" height="720" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="#172554">
<text x="30" y="37" font-size="22" fill="#172554" font-weight="700">LangChain：消息累积驱动模型与工具图</text>
<rect x="30" y="75" width="600" height="86" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="103" font-size="18" fill="#172554" font-weight="700">输入状态</text>
<text x="46" y="130" font-size="16" fill="#172554">messages：用户目标 + 已有观察</text>
<rect x="30" y="211" width="600" height="108" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="239" font-size="18" fill="#172554" font-weight="700">model 节点</text>
<text x="46" y="266" font-size="16" fill="#172554">ModelRequest → middleware → BaseChatModel</text>
<text x="46" y="290" font-size="16" fill="#172554">输出 AIMessage 与可选 tool_calls</text>
<rect x="30" y="379" width="600" height="110" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="407" font-size="18" fill="#172554" font-weight="700">tools 节点</text>
<text x="46" y="434" font-size="16" fill="#172554">按 call ID 调用已注册工具</text>
<text x="46" y="458" font-size="16" fill="#172554">输出 ToolMessage；reducer 合并 messages</text>
<rect x="700" y="379" width="230" height="110" rx="9" fill="#f0fdf4" stroke="#475569" stroke-width="2"/>
<text x="716" y="407" font-size="18" fill="#172554" font-weight="700">结束路由</text>
<text x="716" y="434" font-size="16" fill="#172554">无待执行调用</text>
<text x="716" y="458" font-size="16" fill="#172554">或已获结构化结果</text>
<path d="M330,161 V207" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M330,319 V375" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="348" y="354" font-size="15" fill="#172554">未处理工具调用</text>
<path d="M30,434 H13 V265 H26" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M630,265 H815 V375" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="558" width="900" height="110" rx="9" fill="#eff6ff" stroke="#475569" stroke-width="2"/>
<text x="46" y="586" font-size="18" fill="#172554" font-weight="700">同一任务的状态增长</text>
<text x="46" y="613" font-size="16" fill="#172554">用户要求 → AI 调用 read → read 结果 → AI 调用 edit → edit 结果 → 回答</text>
<text x="46" y="637" font-size="16" fill="#172554">中间件可另改当次请求；graph state 与发送的 messages 不必完全相同</text>
</g></svg>
